<?xml version="1.0" encoding="UTF-8"?>
<!-- model trace: plan at plate level; horizontal = x (-15.5..200.5, fascia-to-fascia),
     vertical = y (front -3.5..0 wall band at top, back 77..80.5 at bottom). Mapping
     X(x)=110.8+3.4*(x+3.5), Y(y)=167.2+2.8*(y+3.5). Rafter centres x -2.75..187.75 at
     15.875; rafters run y -27.5..92.5; first/last over the rake walls; back DTP short
     x 0..185 y 77..80.5; side DTPs: flat part y 0..60.73 + corner block y 77..80.5 catching
     the end rafters' back seats; rake plate zones y 60.73..77 dashed (Stage 7). Colour =
     new layout marks/rafters; hatched = plate material at the cut; dashed = future
     (fascia, Stage 9). -->
<svg viewBox="0 0 840 540" width="210mm" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#555"/>
    </marker>
    <marker id="dimAs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#555"/>
    </marker>
    <marker id="attA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#1a6fb0"/>
    </marker>
    <marker id="secA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#222"/>
    </marker>
    <pattern id="h11p" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M0,7 L7,0" stroke="#777" stroke-width="0.9"/>
    </pattern>
    <style>
      text { fill:#222; }
      .lbl { font-size:13px; }
      .lblb { font-size:13px; font-weight:bold; }
      .small { font-size:12px; }
    </style>
  </defs>

  <!-- view badge -->
  <rect x="12" y="10" width="346" height="62" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="24" y="30" class="lblb">PLAN · wall-plate level — looking down</text>
  <text x="24" y="47" class="lbl">horizontal cut just below the plate tops</text>
  <text x="24" y="64" class="small">cut line B–B: the section is shown in Fig 11.2</text>

  <!-- orientation -->
  <text x="440" y="84"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">FRONT — street side (high side of the roof)</text>
  <text x="440" y="84"  class="lblb" text-anchor="middle">FRONT — street side (high side of the roof)</text>
  <text x="440" y="422"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">BACK (low side)</text>
  <text x="440" y="422"  class="lblb" text-anchor="middle">BACK (low side)</text>

  <!-- wall footprint below the cut (dashed) -->
  <rect x="110.8" y="177" width="652.8" height="215.6" fill="none" stroke="#8c8c8c"
        stroke-width="1.2" stroke-dasharray="8,5"/>

  <!-- double top plates at the cut (hatched); rake plate zones dashed (Stage 7) -->
  <g stroke="#666" stroke-width="1.2">
    <rect x="110.8" y="167.2" width="652.8" height="9.8" fill="#e9e9e9"/>
    <rect x="122.8" y="392.6" width="628.9" height="9.8" fill="#e9e9e9"/>
    <rect x="110.8" y="177" width="12" height="170.05" fill="#e9e9e9"/>
    <rect x="751.7" y="177" width="11.9" height="170.05" fill="#e9e9e9"/>
    <rect x="110.8" y="392.6" width="12" height="9.8" fill="#e9e9e9"/>
    <rect x="751.7" y="392.6" width="11.9" height="9.8" fill="#e9e9e9"/>
  </g>
  <g fill="url(#h11p)" stroke="none">
    <rect x="110.8" y="167.2" width="652.8" height="9.8"/>
    <rect x="122.8" y="392.6" width="628.9" height="9.8"/>
    <rect x="110.8" y="177" width="12" height="170.05"/>
    <rect x="751.7" y="177" width="11.9" height="170.05"/>
    <rect x="110.8" y="392.6" width="12" height="9.8"/>
    <rect x="751.7" y="392.6" width="11.9" height="9.8"/>
  </g>
  <g fill="none" stroke="#8c8c8c" stroke-width="1.2" stroke-dasharray="6,4">
    <rect x="110.8" y="347.05" width="12" height="45.55"/>
    <rect x="751.7" y="347.05" width="11.9" height="45.55"/>
  </g>
  <text x="117" y="300"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" transform="rotate(-90 117 300)">flat side DTP · 5' ¾"</text>
  <text x="117" y="300"  class="small" transform="rotate(-90 117 300)">flat side DTP · 5' ¾"</text>
  <text x="117" y="390"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" transform="rotate(-90 117 390)">rake plate ↓</text>
  <text x="117" y="390"  class="small" transform="rotate(-90 117 390)">rake plate ↓</text>
  <text x="141" y="372"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">corner block</text>
  <text x="141" y="372"  class="small">corner block</text>

  <!-- future fascia (dashed, Stage 9) -->
  <g fill="none" stroke="#8c8c8c" stroke-width="1.2" stroke-dasharray="8,5">
    <rect x="70" y="95.6" width="734.4" height="4.2"/>
    <rect x="70" y="436" width="734.4" height="4.2"/>
  </g>
  <text x="74" y="93"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">front fascia — Stage 9 (future work, dashed)</text>
  <text x="74" y="93"  class="small">front fascia — Stage 9 (future work, dashed)</text>
  <text x="74" y="456"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">back fascia — Stage 9 (future work, dashed)</text>
  <text x="74" y="456"  class="small">back fascia — Stage 9 (future work, dashed)</text>

  <!-- NEW WORK: 13 rafters on their marks -->
  <g fill="#d9a441" stroke="#6b4f16" stroke-width="1.2">
    <rect x="110.8" y="100" width="5.1" height="336"/>
    <rect x="164.78" y="100" width="5.1" height="336"/>
    <rect x="218.75" y="100" width="5.1" height="336"/>
    <rect x="272.73" y="100" width="5.1" height="336"/>
    <rect x="326.7" y="100" width="5.1" height="336"/>
    <rect x="380.68" y="100" width="5.1" height="336"/>
    <rect x="434.65" y="100" width="5.1" height="336"/>
    <rect x="488.63" y="100" width="5.1" height="336"/>
    <rect x="542.6" y="100" width="5.1" height="336"/>
    <rect x="596.58" y="100" width="5.1" height="336"/>
    <rect x="650.55" y="100" width="5.1" height="336"/>
    <rect x="704.53" y="100" width="5.1" height="336"/>
    <rect x="758.5" y="100" width="5.1" height="336"/>
  </g>

  <!-- spacing dimension -->
  <line x1="113.35" y1="192" x2="167.33" y2="192" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <text x="140" y="210"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">15⅞″ o.c.</text>
  <text x="140" y="210"  class="lbl" text-anchor="middle">15⅞″ o.c.</text>
  <text x="212" y="130"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">first rafter over the left rake wall —</text>
  <text x="212" y="130"  class="lbl">first rafter over the left rake wall —</text>
  <text x="212" y="146"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">its centre is ¾″ from the plate's left end</text>
  <text x="212" y="146"  class="lbl">its centre is ¾″ from the plate's left end</text>
  <line x1="210" y1="134" x2="116" y2="108" stroke="#555" stroke-width="1"/>

  <!-- member label + attachment arrow -->
  <text x="270" y="270"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">13 × rafter · 2×6 · 10' 8⅛″</text>
  <text x="270" y="270"  class="lblb">13 × rafter · 2×6 · 10' 8⅛″</text>
  <text x="270" y="288"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">centres marked on BOTH plates</text>
  <text x="270" y="288"  class="lbl">centres marked on BOTH plates</text>
  <line x1="380" y1="258" x2="384" y2="182" stroke="#1a6fb0" stroke-width="1.8"
        marker-end="url(#attA)"/>
  <text x="396" y="240"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">each rafter seats on both plates</text>
  <text x="396" y="240"  class="small" fill="#1a6fb0">each rafter seats on both plates</text>

  <!-- cut line B-B -->
  <line x1="491.15" y1="76" x2="491.15" y2="446" stroke="#222" stroke-width="1.6"
        stroke-dasharray="14,5,3,5"/>
  <line x1="505" y1="70" x2="479" y2="70" stroke="#222" stroke-width="1.6" marker-end="url(#secA)"/>
  <text x="509" y="74" class="lblb">B</text>
  <line x1="505" y1="452" x2="479" y2="452" stroke="#222" stroke-width="1.6" marker-end="url(#secA)"/>
  <text x="509" y="456" class="lblb">B</text>

  <!-- layout marks text -->
  <text x="70" y="476"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">mark rafter centres on BOTH plates, measured from the left end of the front double top plate:</text>
  <text x="70" y="476"  class="lbl">mark rafter centres on BOTH plates, measured from the left end of the front double top plate:</text>
  <text x="70" y="494"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">¾″, 16⅝″, 32½″, 48⅜″ and so on — every 15⅞″ out to 191¼″. The back plate starts 3½″ inboard — subtract 3½″ from each reading.</text>
  <text x="70" y="494"  class="lbl">¾″, 16⅝″, 32½″, 48⅜″ and so on — every 15⅞″ out to 191¼″. The back plate starts 3½″ inboard — subtract 3½″ from each reading.</text>
  <text x="70" y="512"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">first and last rafters sit over the rake walls; their back seats land on the side walls' double-top-plate corner blocks.</text>
  <text x="70" y="512"  class="small">first and last rafters sit over the rake walls; their back seats land on the side walls' double-top-plate corner blocks.</text>
</svg>
