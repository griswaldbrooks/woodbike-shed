<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- model trace: left wall, interior view (facing -x): front/street end (y 0) drawn RIGHT,
back end (y 80.5) left. px(t)=560-4*t, t = inches from the front end; y(z)=600-4*z.
Bottom/top plate t 0..77 / 0..64.75; double top plate t 0..60.75; studs t 0,15.5,31.5,47.5,63.5
z 1.5..94.125; corner post t 77..78.5 z 1.5..89.625; DTP corner block t 77..80.5 z 91.125..92.625;
above the plate ends the gable follows the roof (Stage 7, dashed) -->
<defs>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#444"/>
  </marker>
</defs>

<rect x="0" y="0" width="720" height="680" fill="#ffffff"/>

<!-- view badge -->
<g>
  <rect x="14" y="12" width="366" height="76" fill="#ffffff" stroke="#222" stroke-width="2.5" rx="6"/>
  <text x="26" y="36" font-size="16.5" font-weight="bold" fill="#111">ELEVATION · LEFT WALL</text>
  <text x="26" y="57" font-size="14.5" fill="#111">viewed from inside the shed (front end at right)</text>
  <text x="26" y="78" font-size="14.5" fill="#111">frame anchor: gravity</text>
  <line x1="354" y1="46" x2="354" y2="70" stroke="#111" stroke-width="3"/>
  <path d="M347,66 L354,78 L361,66 z" fill="#111"/>
</g>

<!-- deck line + hatch -->
<line x1="230" y1="600" x2="650" y2="600" stroke="#222" stroke-width="3"/>
<g stroke="#666" stroke-width="1.6">
  <line x1="242" y1="600" x2="230" y2="614"/><line x1="282" y1="600" x2="270" y2="614"/>
  <line x1="322" y1="600" x2="310" y2="614"/><line x1="362" y1="600" x2="350" y2="614"/>
  <line x1="402" y1="600" x2="390" y2="614"/><line x1="442" y1="600" x2="430" y2="614"/>
  <line x1="482" y1="600" x2="470" y2="614"/><line x1="522" y1="600" x2="510" y2="614"/>
  <line x1="562" y1="600" x2="550" y2="614"/><line x1="602" y1="600" x2="590" y2="614"/>
  <line x1="642" y1="600" x2="630" y2="614"/>
</g>
<text x="646" y="634" font-size="15" fill="#222" text-anchor="end" font-weight="bold">FRONT end (street)</text>
<text x="234" y="634" font-size="15" fill="#222">BACK end</text>

<!-- bottom plate t 0..77 -->
<rect x="252" y="594" width="308" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- studs z 1.5..94.125 -> y 594..223.5 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="554" y="223.5" width="6" height="370.5"/>
  <rect x="492" y="223.5" width="6" height="370.5"/>
  <rect x="428" y="223.5" width="6" height="370.5"/>
  <rect x="364" y="223.5" width="6" height="370.5"/>
  <rect x="300" y="223.5" width="6" height="370.5"/>
</g>

<!-- corner post z 1.5..89.625 -> y 594..241.5 -->
<rect x="246" y="241.5" width="6" height="352.5" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- top plate t 0..64.75 (y 223.5..217.5); DTP t 0..60.75 (y 217.5..211.5) -->
<rect x="301" y="217.5" width="259" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="317" y="211.5" width="243" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- DTP corner block t 77..80.5, z 91.125..92.625 -> y 234.5..228.5 -->
<rect x="238" y="228.5" width="14" height="6" fill="#e8c07a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- dashed: gable follows the roof above the plate ends (Stage 7) -->
<g stroke="#888" stroke-width="2" stroke-dasharray="7 5" fill="none">
  <line x1="317" y1="211.5" x2="252" y2="228.5"/>
  <line x1="252" y1="228.5" x2="238" y2="231"/>
</g>
<text x="120" y="196" font-size="13.5" fill="#666">above the plate ends the gable follows the roof —</text>
<text x="120" y="213" font-size="13.5" fill="#666">rake plate + mitered studs, Stage 7</text>

<!-- nailed joints (representative) -->
<g stroke="#7a2e12" stroke-width="2">
  <line x1="301" y1="590" x2="309" y2="598"/><line x1="309" y1="590" x2="301" y2="598"/>
  <line x1="551" y1="590" x2="559" y2="598"/><line x1="559" y1="590" x2="551" y2="598"/>
  <line x1="361" y1="212" x2="369" y2="220"/><line x1="369" y1="212" x2="361" y2="220"/>
  <line x1="551" y1="212" x2="559" y2="220"/><line x1="559" y1="212" x2="551" y2="220"/>
</g>

<!-- labels -->
<g font-size="15.5" fill="#111">
  <line x1="492" y1="420" x2="446" y2="400" stroke="#444" stroke-width="1.4"/>
  <text x="342" y="396">stud · 2×4 ·</text>
  <text x="342" y="415">7' 8⅝" pre-cut × 5</text>
  <line x1="249" y1="470" x2="200" y2="470" stroke="#444" stroke-width="1.4"/>
  <text x="26" y="466">corner post · 2×4 · 7' 4⅛"</text>
  <text x="26" y="485" font-size="13.5" fill="#666">carries the corner rafter</text>
  <line x1="245" y1="231" x2="180" y2="262" stroke="#444" stroke-width="1.4"/>
  <text x="16" y="278">DTP corner block · 3½"</text>
  <line x1="330" y1="214" x2="286" y2="160" stroke="#444" stroke-width="1.4"/>
  <text x="60" y="150">double top plate · 5' ¾" — ends where the roof</text>
  <text x="60" y="168" font-size="13.5" fill="#666">drops past it; the gable takes over (Stage 7)</text>
  <line x1="430" y1="597" x2="390" y2="560" stroke="#444" stroke-width="1.4"/>
  <text x="300" y="556">bottom plate · 2×4 · 6' 5"</text>
</g>

<!-- dimensions -->
<g stroke="#444" stroke-width="1.4" font-size="15" fill="#222">
  <line x1="238" y1="656" x2="560" y2="656" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="238" y1="648" x2="238" y2="664"/><line x1="560" y1="648" x2="560" y2="664"/>
  <text x="399" y="678" text-anchor="middle">6' 8½" overall</text>
  <line x1="688" y1="600" x2="688" y2="211.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="680" y1="600" x2="696" y2="600"/><line x1="680" y1="211.5" x2="696" y2="211.5"/>
  <text x="706" y="430" transform="rotate(-90,706,430)" text-anchor="middle">97⅛" at the plate</text>
</g>
</svg>
