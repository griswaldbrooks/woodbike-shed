<svg viewBox="0 0 780 672" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 5.1 — floor framing plan.
       model trace: rims x -3.5..188.5, y -3.5..-2 and 67..68.5; joist x edges -3.5, 11, 27, 43, 59, 75, 91, 92.5,
       108.5, 124.5, 140.5, 156.5, 172.5, 187 (tape 0, 14½, 30½, 46½, 62½, 78½, 94½/96, 112, 128, 144, 160, 176, 190½);
       OSB seams x 44.5/92.5/140.5 (tape 48/96/144); C-C cut at tape 128¾ (through joist 10, x 124.5..126).
       mapping X(x)=100+(x+3.5)*3.2, Y(y)=200+(y+3.5)*3.2; joist widths exaggerated for readability -->
  <rect width="780" height="672" fill="#ffffff"/>
  <defs>
    <marker id="dim05a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#444"/></marker>
    <marker id="dim05as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#444"/></marker>
  </defs>

  <!-- view badge -->
  <g>
    <rect x="16" y="14" width="350" height="92" fill="#faf8f2" stroke="#2b2b2b" stroke-width="2" rx="6"/>
    <text x="30" y="40" font-size="19" font-weight="bold" fill="#2b2b2b">PLAN</text>
    <text x="30" y="64" font-size="14" fill="#2b2b2b">looking straight DOWN from above</text>
    <text x="30" y="86" font-size="14" fill="#2b2b2b">FRONT (street) at top · cut at deck top</text>
  </g>

  <text x="407" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">FRONT — street side (tall wall, doors)</text>

  <!-- doubled pair callout -->
  <text x="648" y="164" text-anchor="middle" font-size="13.5" fill="#c0392b">doubled pair — middle seam lands here</text>
  <path d="M560,170 L416,201" stroke="#c0392b" stroke-width="1.4" fill="none"/>

  <!-- skids: built in Stage 1, grey -->
  <g fill="#efefef" stroke="#8a8a8a" stroke-width="2">
    <rect x="100" y="200" width="614.4" height="11.2"/>
    <rect x="100" y="419.2" width="614.4" height="11.2"/>
  </g>
  <!-- rim joists: new -->
  <g fill="#e2c795" stroke="#8B6914" stroke-width="2">
    <rect x="100" y="200" width="614.4" height="6"/>
    <rect x="100" y="424.4" width="614.4" height="6"/>
  </g>

  <!-- 14 floor joists: new -->
  <g fill="#d4a76a" stroke="#8B6914" stroke-width="1.5">
    <rect x="100" y="206" width="6" height="218.4"/>
    <rect x="146.4" y="206" width="6" height="218.4"/>
    <rect x="197.6" y="206" width="6" height="218.4"/>
    <rect x="248.8" y="206" width="6" height="218.4"/>
    <rect x="300" y="206" width="6" height="218.4"/>
    <rect x="351.2" y="206" width="6" height="218.4"/>
    <rect x="402.4" y="206" width="6" height="218.4"/>
    <rect x="407.2" y="206" width="6" height="218.4"/>
    <rect x="458.4" y="206" width="6" height="218.4"/>
    <rect x="509.6" y="206" width="6" height="218.4"/>
    <rect x="560.8" y="206" width="6" height="218.4"/>
    <rect x="612" y="206" width="6" height="218.4"/>
    <rect x="663.2" y="206" width="6" height="218.4"/>
    <rect x="708.4" y="206" width="6" height="218.4"/>
  </g>
  <rect x="420" y="215" width="300" height="18" fill="#ffffff" opacity="0.85"/>
  <text x="714" y="228" text-anchor="end" font-size="13" fill="#8a8a8a">4×4 skids — set in Stage 1 (grey = built)</text>
  <rect x="372" y="401" width="346" height="18" fill="#ffffff" opacity="0.85"/>
  <text x="714" y="414" text-anchor="end" font-size="13" fill="#8B6914">back rim · 2×6 · 16 ft 0 in — flat-side out on the skid</text>
  <text transform="translate(466,232) rotate(90)" font-size="12" fill="#8B6914">floor joist · 2×6 · 5 ft 9 in</text>

  <!-- OSB sheet outlines + seams: future this page, dashed -->
  <g fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="6,5">
    <rect x="100" y="200" width="614.4" height="230.4"/>
    <line x1="253.6" y1="200" x2="253.6" y2="430.4"/>
    <line x1="407.2" y1="200" x2="407.2" y2="430.4"/>
    <line x1="560.8" y1="200" x2="560.8" y2="430.4"/>
  </g>
  <g font-size="13" fill="#555" text-anchor="middle">
    <text x="253.6" y="192">seam at 48 in</text>
    <text x="407.2" y="192">96 in</text>
    <text x="560.8" y="192">144 in</text>
  </g>

  <!-- note chips -->
  <g>
    <rect x="120" y="240" width="252" height="58" fill="#ffffff" fill-opacity="0.92" stroke="#ddd" rx="5"/>
    <g stroke="#444" stroke-width="2"><line x1="134" y1="266" x2="148" y2="252"/><line x1="131" y1="253" x2="137" y2="251"/></g>
    <text x="156" y="258" font-size="13" fill="#444">rims bear flat on the skid tops, ends</text>
    <text x="156" y="274" font-size="13" fill="#444">flush — nail rims to skids, joist ends</text>
    <text x="156" y="290" font-size="13" fill="#444">to rims (fasteners not on the orders)</text>
    <rect x="120" y="312" width="252" height="40" fill="#ffffff" fill-opacity="0.92" stroke="#ddd" rx="5"/>
    <text x="134" y="330" font-size="13" fill="#555">4 × ¾ in OSB half-sheets, 72 × 48 in —</text>
    <text x="134" y="346" font-size="13" fill="#555">dashed sheets = decking, later this page</text>
  </g>

  <!-- drop symbols on rims -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <circle cx="470" cy="203" r="6"/><line x1="465.8" y1="198.8" x2="474.2" y2="207.2"/><line x1="474.2" y1="198.8" x2="465.8" y2="207.2"/>
    <circle cx="470" cy="427.4" r="6"/><line x1="465.8" y1="423.2" x2="474.2" y2="431.6"/><line x1="474.2" y1="423.2" x2="465.8" y2="431.6"/>
  </g>

  <!-- cut line C-C at tape 128¾ (through joist 10), viewed toward the LEFT end -->
  <line x1="512" y1="172" x2="512" y2="470" stroke="#333" stroke-width="2.6" stroke-dasharray="14,5,3,5"/>
  <path d="M500,166 L512,160 L512,172 Z" fill="#333"/>
  <path d="M500,476 L512,470 L512,482 Z" fill="#333"/>
  <text x="494" y="170" text-anchor="end" font-size="15" font-weight="bold" fill="#333">C</text>
  <text x="494" y="482" text-anchor="end" font-size="15" font-weight="bold" fill="#333">C</text>
  <text x="524" y="466" font-size="13" fill="#333">C–C → Fig 5.2 · view toward LEFT end</text>

  <!-- layout dimension chain: tape readings to joist left edges -->
  <g stroke="#999" stroke-width="1">
    <line x1="100" y1="436" x2="100" y2="508"/>
    <line x1="146.4" y1="436" x2="146.4" y2="508"/>
    <line x1="197.6" y1="436" x2="197.6" y2="508"/>
    <line x1="248.8" y1="436" x2="248.8" y2="508"/>
    <line x1="300" y1="436" x2="300" y2="508"/>
    <line x1="351.2" y1="436" x2="351.2" y2="508"/>
    <line x1="402.4" y1="436" x2="402.4" y2="508"/>
    <line x1="407.2" y1="436" x2="407.2" y2="508"/>
    <line x1="458.4" y1="436" x2="458.4" y2="508"/>
    <line x1="509.6" y1="436" x2="509.6" y2="508"/>
    <line x1="560.8" y1="436" x2="560.8" y2="508"/>
    <line x1="612" y1="436" x2="612" y2="508"/>
    <line x1="663.2" y1="436" x2="663.2" y2="508"/>
    <line x1="709.6" y1="436" x2="709.6" y2="508"/>
  </g>
  <text x="640" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">BACK</text>
  <line x1="100" y1="508" x2="714.4" y2="508" stroke="#444" stroke-width="1.4" marker-start="url(#dim05as)" marker-end="url(#dim05a)"/>
  <g font-size="13" fill="#2b2b2b">
    <text transform="translate(96,514) rotate(90)">0 in</text>
    <text transform="translate(142.4,552) rotate(90)">14½ in</text>
    <text transform="translate(193.6,514) rotate(90)">30½ in</text>
    <text transform="translate(244.8,552) rotate(90)">46½ in</text>
    <text transform="translate(296,514) rotate(90)">62½ in</text>
    <text transform="translate(347.2,552) rotate(90)">78½ in</text>
    <text transform="translate(398.4,514) rotate(90)" font-weight="bold">94½ in</text>
    <text transform="translate(411,552) rotate(90)" font-weight="bold">96 in</text>
    <text transform="translate(454.4,514) rotate(90)">112 in</text>
    <text transform="translate(505.6,552) rotate(90)">128 in</text>
    <text transform="translate(556.8,514) rotate(90)">144 in</text>
    <text transform="translate(608,552) rotate(90)">160 in</text>
    <text transform="translate(659.2,514) rotate(90)">176 in</text>
    <text transform="translate(716,544) rotate(90)">190½ in</text>
  </g>
  <g stroke="#bbb" stroke-width="0.9">
    <line x1="146.4" y1="508" x2="146.4" y2="548"/>
    <line x1="248.8" y1="508" x2="248.8" y2="548"/>
    <line x1="351.2" y1="508" x2="351.2" y2="548"/>
    <line x1="407.2" y1="508" x2="411" y2="548"/>
    <line x1="509.6" y1="508" x2="509.6" y2="548"/>
    <line x1="612" y1="508" x2="612" y2="548"/>
    <line x1="709.6" y1="508" x2="713.4" y2="548"/>
  </g>

  <!-- overall dims -->
  <line x1="100" y1="600" x2="714.4" y2="600" stroke="#444" stroke-width="1.4" marker-start="url(#dim05as)" marker-end="url(#dim05a)"/>
  <line x1="100" y1="592" x2="100" y2="606" stroke="#999" stroke-width="1"/>
  <line x1="714.4" y1="592" x2="714.4" y2="606" stroke="#999" stroke-width="1"/>
  <text x="407" y="594" text-anchor="middle" font-size="13.5" fill="#444">16 ft 0 in overall</text>
  <line x1="735" y1="200" x2="735" y2="430.4" stroke="#444" stroke-width="1.4" marker-start="url(#dim05as)" marker-end="url(#dim05a)"/>
  <line x1="718" y1="200" x2="742" y2="200" stroke="#999" stroke-width="1"/>
  <line x1="718" y1="430.4" x2="742" y2="430.4" stroke="#999" stroke-width="1"/>
  <text x="752" y="315" font-size="13" fill="#444" transform="rotate(90,752,315)" text-anchor="middle">6 ft 0 in overall</text>

  <text x="407" y="626" text-anchor="middle" font-size="13" fill="#555">tape readings from the LEFT-end mark to each joist's left edge · 16 in on centre in the field · joist widths exaggerated</text>

  <!-- legend -->
  <g font-size="13" fill="#444">
    <rect x="90" y="638" width="600" height="28" fill="#fafaf8" stroke="#ddd" rx="5"/>
    <rect x="102" y="646" width="18" height="12" fill="#d4a76a" stroke="#8B6914" stroke-width="1.5"/>
    <text x="126" y="656">new this stage</text>
    <rect x="234" y="646" width="18" height="12" fill="#efefef" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="258" y="656">built in Stage 1</text>
    <line x1="380" y1="652" x2="410" y2="652" stroke="#555" stroke-width="1.8" stroke-dasharray="6,5"/>
    <text x="416" y="656">future (deck sheets)</text>
    <circle cx="566" cy="652" r="6" fill="none" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="561.8" y1="647.8" x2="570.2" y2="656.2" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="570.2" y1="647.8" x2="561.8" y2="656.2" stroke="#c0392b" stroke-width="1.8"/>
    <text x="580" y="656">drops DOWN onto seat</text>
  </g>
</svg>
