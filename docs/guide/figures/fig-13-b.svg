<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2b2b2b"/></marker>
    <marker id="arrd" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a4a4a" stroke-width="1" opacity="0.45"/></pattern>
    <pattern id="hatchgrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/></pattern>
  </defs>

  <rect width="540" height="620" fill="#ffffff"/>
  <rect x="10.0" y="10.0" width="518.0" height="83.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="24.0" y="39.0" font-size="16" text-anchor="start" font-weight="bold" fill="#2b2b2b">SECTION</text>
  <text x="24.0" y="59.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">two nested courses on the wall face, viewed from the left gable end</text>
  <text x="24.0" y="79.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">&#9660; DOWN &#183; deck top is the height datum</text>
  <rect x="116.0" y="118.0" width="161.0" height="364.0" fill="#f0f0f0" stroke="#808080" stroke-width="1.5"/>
  <rect x="116.0" y="482.0" width="161.0" height="39.0" fill="#e6e6e6" stroke="#808080" stroke-width="1.5"/>
  <rect x="70.0" y="521.0" width="207.0" height="19.5" fill="#e6e6e6" stroke="#808080" stroke-width="1.5"/>
  <line x1="26.0" y1="521.0" x2="277.0" y2="521.0" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="28.0" y="513.0" font-size="13" text-anchor="start" font-weight="bold" fill="#2b2b2b">deck top</text>
  <rect x="311.5" y="508.0" width="34.5" height="52.0" fill="#e6e6e6" stroke="#808080" stroke-width="1.5"/>
  <text x="354.0" y="592.0" font-size="13" text-anchor="start" font-weight="normal" fill="#808080">skirt (set in step 1)</text>
  <line x1="380.0" y1="580.0" x2="327.6" y2="545.0" stroke="#808080" stroke-width="1" marker-end="url(#arrd)"/>
  <polygon points="277.0,521.0 277.0,326.0 294.2,326.0 294.2,339.0 311.5,339.0 311.5,521.0" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <polygon points="277.0,326.0 277.0,144.0 294.2,144.0 294.2,157.0 311.5,157.0 311.5,339.0 294.2,339.0 294.2,326.0" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <line x1="277.0" y1="118.0" x2="277.0" y2="521.0" stroke="#808080" stroke-width="1.5"/>
  <text x="270.0" y="112.0" font-size="13" text-anchor="start" font-weight="normal" fill="#808080">wall face</text>
  <line x1="311.5" y1="521.0" x2="364.0" y2="521.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="311.5" y1="339.0" x2="364.0" y2="339.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360.0" y1="521.0" x2="360.0" y2="339.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="356.0" y1="521.0" x2="364.0" y2="521.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="356.0" y1="339.0" x2="364.0" y2="339.0" stroke="#555555" stroke-width="1.2"/>
  <text x="368.0" y="434.5" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">7&#8243; exposure</text>
  <line x1="360.0" y1="339.0" x2="360.0" y2="326.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="356.0" y1="339.0" x2="364.0" y2="339.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="356.0" y1="326.0" x2="364.0" y2="326.0" stroke="#555555" stroke-width="1.2"/>
  <text x="368.0" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">&#189;&#8243;</text>
  <line x1="311.5" y1="339.0" x2="390.0" y2="339.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="311.5" y1="144.0" x2="390.0" y2="144.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="386.0" y1="339.0" x2="386.0" y2="144.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="382.0" y1="339.0" x2="390.0" y2="339.0" stroke="#555555" stroke-width="1.2"/>
  <line x1="382.0" y1="144.0" x2="390.0" y2="144.0" stroke="#555555" stroke-width="1.2"/>
  <text x="394.0" y="246.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">7&#189;&#8243; board</text>
  <text x="196.0" y="310.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">the &#8532;&#8243; tongue of the lower course</text>
  <text x="196.0" y="327.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">fills the rabbet of the one above</text>
  <line x1="194.0" y1="318.0" x2="302.3" y2="332.5" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <text x="60.0" y="566.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#2b2b2b">every course backs on the same wall face &#8212;</text>
  <text x="60.0" y="584.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#2b2b2b">the wall stays in ONE plane, no bevel drift</text>
  <text x="60.0" y="425.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">course below</text>
  <line x1="130.0" y1="421.0" x2="281.6" y2="430.0" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <text x="60.0" y="230.0" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">course above</text>
  <line x1="130.0" y1="226.0" x2="281.6" y2="235.0" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <line x1="36.0" y1="300.0" x2="36.0" y2="370.0" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="32.0" y="388.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2b2b2b">DOWN</text>
</svg>
