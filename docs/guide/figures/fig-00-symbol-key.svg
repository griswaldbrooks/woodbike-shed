<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 705" role="img">
  <!-- symbol key: reference chart, not a view of the building -->
  <rect width="760" height="705" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">

    <!-- header badge -->
    <rect x="16" y="14" width="728" height="82" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="3"/>
    <text x="34" y="46" font-size="24" font-weight="bold">SYMBOL KEY</text>
    <text x="210" y="46" font-size="20">reference chart</text>
    <text x="34" y="80" font-size="18">not a view of the building — it explains the marks every figure in this guide uses</text>

    <!-- panel 1: the view badge -->
    <rect x="16" y="110" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="30" y="138" font-size="20" font-weight="bold">1 · The view badge</text>
    <rect x="30" y="152" width="200" height="86" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.5"/>
    <text x="42" y="180" font-size="20" font-weight="bold">ELEVATION</text>
    <text x="42" y="206" font-size="18">viewed from the street</text>
    <text x="42" y="230" font-size="18">DOWN ↓</text>
    <line x1="230" y1="172" x2="262" y2="166" stroke="#3a3a3a" stroke-width="2"/>
    <text x="266" y="172" font-size="18">view type</text>
    <line x1="230" y1="200" x2="262" y2="200" stroke="#3a3a3a" stroke-width="2"/>
    <text x="266" y="206" font-size="18">which way</text>
    <text x="266" y="228" font-size="18">you look</text>
    <line x1="230" y1="224" x2="262" y2="252" stroke="#3a3a3a" stroke-width="2"/>
    <text x="266" y="258" font-size="18">frame anchor</text>
    <text x="30" y="270" font-size="18">anchor = gravity arrow, cut height,</text>
    <text x="30" y="290" font-size="18">or axis corner</text>

    <!-- panel 2: colour states -->
    <rect x="384" y="110" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="398" y="138" font-size="20" font-weight="bold">2 · Colour states</text>
    <rect x="398" y="152" width="70" height="26" fill="#c89f6b" stroke="#3a3a3a" stroke-width="3"/>
    <text x="482" y="172" font-size="18">new work — full colour</text>
    <rect x="398" y="196" width="70" height="26" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
    <text x="482" y="216" font-size="18">already built — grey outline</text>
    <rect x="398" y="240" width="70" height="26" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="482" y="260" font-size="18">future work — dashed</text>

    <!-- panel 3: attachment arrow -->
    <rect x="16" y="305" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="30" y="333" font-size="20" font-weight="bold">3 · Attachment arrow</text>
    <rect x="40" y="430" width="200" height="30" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
    <rect x="120" y="352" width="40" height="78" fill="#c89f6b" stroke="#3a3a3a" stroke-width="3"/>
    <line x1="200" y1="360" x2="200" y2="418" stroke="#3a3a3a" stroke-width="3"/>
    <polygon points="200,430 193,414 207,414" fill="#3a3a3a"/>
    <circle cx="132" cy="445" r="3.5" fill="#3a3a3a"/>
    <circle cx="140" cy="450" r="3.5" fill="#3a3a3a"/>
    <circle cx="148" cy="445" r="3.5" fill="#3a3a3a"/>
    <text x="216" y="380" font-size="18">arrow to</text>
    <text x="216" y="402" font-size="18">the seat</text>
    <text x="30" y="480" font-size="18">plus the attachment symbol at the joint</text>

    <!-- panel 4: attachment modes -->
    <rect x="384" y="305" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="398" y="333" font-size="20" font-weight="bold">4 · Attachment modes</text>
    <circle cx="420" cy="380" r="4" fill="#3a3a3a"/>
    <circle cx="432" cy="390" r="4" fill="#3a3a3a"/>
    <circle cx="420" cy="400" r="4" fill="#3a3a3a"/>
    <text x="402" y="432" font-size="18">nails</text>
    <circle cx="500" cy="390" r="12" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <line x1="492" y1="390" x2="508" y2="390" stroke="#3a3a3a" stroke-width="3"/>
    <text x="482" y="432" font-size="18">screw</text>
    <rect x="552" y="378" width="34" height="10" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <rect x="586" y="383" width="34" height="10" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="586" cy="388" r="6" fill="#3a3a3a"/>
    <text x="562" y="432" font-size="18">hinge</text>
    <polygon points="652,400 682,400 682,378 668,378 668,390 652,390" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <text x="640" y="432" font-size="18">seat cut</text>
    <text x="398" y="462" font-size="18">the symbol at the arrow tip says</text>
    <text x="398" y="482" font-size="18">how the part fastens</text>

    <!-- panel 5: prohibition -->
    <rect x="16" y="500" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="30" y="528" font-size="20" font-weight="bold">5 · Prohibition — do not</text>
    <rect x="40" y="620" width="100" height="28" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
    <rect x="240" y="620" width="100" height="28" fill="#ffffff" stroke="#9a9a9a" stroke-width="3"/>
    <rect x="40" y="590" width="280" height="26" fill="#c89f6b" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="190" cy="612" r="54" fill="none" stroke="#d02020" stroke-width="9"/>
    <line x1="152" y1="574" x2="228" y2="650" stroke="#d02020" stroke-width="9"/>
    <text x="30" y="678" font-size="18">a crossed frame shows the mistake to avoid</text>

    <!-- panel 6: warning -->
    <rect x="384" y="500" width="360" height="185" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="398" y="528" font-size="20" font-weight="bold">6 · Warning</text>
    <polygon points="470,552 414,650 526,650" fill="#f7c948" stroke="#1a1a1a" stroke-width="4"/>
    <text x="470" y="636" font-size="56" font-weight="bold" text-anchor="middle">!</text>
    <text x="546" y="600" font-size="18">safety message,</text>
    <text x="546" y="622" font-size="18">printed at the step</text>
    <text x="546" y="644" font-size="18">that carries the hazard</text>
  </g>
</svg>
