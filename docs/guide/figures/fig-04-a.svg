<svg viewBox="0 0 780 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 4.1 — foundation layout, plan: the whole 16' x 7' footprint is one compacted gravel pad.
       model trace: footprint x -3.5..188.5, y -3.5..80.5 (192" x 84"); skid lines y -3.5..0 and 77..80.5;
       skid centerlines y -1.75 and 78.75 (80.5" = 6' 8½" c/c); each skid's outside face flush with the
       footprint edge, centerline 1¾" in from the edge. Foundation stack below the skids (fabric +
       tamped ¾" gravel) is drawn, not modeled. Piers/pedestals/paver pads DROPPED 2026-08-24 per
       captain decision (firstmate data/shed-guide-depth-pass/captain-decision-2026-08-24.md).
       Mapping X(x)=100+(x+3.5)*3.2, Y(y)=200+(y+3.5)*3.2 (3.2 px/in). The 1¾" skid inset is a leader
       label, not a dimension line — too short for true arrowheads at this scale. -->
  <rect width="780" height="680" fill="#ffffff"/>
  <defs>
    <marker id="dim04a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#444"/></marker>
    <marker id="dim04as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#444"/></marker>
    <pattern id="pad04a" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="#efe9db"/>
      <path d="M0,16 L16,0" stroke="#b3a888" stroke-width="1"/>
      <path d="M-4,4 L4,-4" stroke="#b3a888" stroke-width="1"/>
      <path d="M12,20 L20,12" stroke="#b3a888" stroke-width="1"/>
      <circle cx="6" cy="5" r="1.7" fill="#a8a294"/>
      <circle cx="15" cy="11" r="2" fill="#b5af9f"/>
    </pattern>
  </defs>

  <!-- view badge -->
  <g>
    <rect x="16" y="14" width="350" height="92" fill="#faf8f2" stroke="#2b2b2b" stroke-width="2" rx="6"/>
    <text x="30" y="40" font-size="19" font-weight="bold" fill="#2b2b2b">PLAN</text>
    <text x="30" y="64" font-size="14" fill="#2b2b2b">looking straight DOWN from above</text>
    <text x="30" y="86" font-size="14" fill="#2b2b2b">FRONT (street) at top · cut at grade</text>
  </g>

  <text x="407" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">FRONT — street side (tall wall, doors)</text>

  <!-- gravel pad: the whole footprint, hatched = dug to firm soil and refilled with tamped stone -->
  <rect x="100" y="200" width="614.4" height="268.8" fill="url(#pad04a)" stroke="#8a7c55" stroke-width="2.4"/>
  <g text-anchor="middle" font-size="14">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <text x="430" y="330" font-weight="bold" fill="#ffffff" stroke="#ffffff">¾ in ANGULAR crushed stone — tamped in 3 in lifts, screeded FLAT AND LEVEL</text>
      <text x="430" y="350">the whole 16 ft × 7 ft footprint is one pad — no pockets, no pedestals</text>
    </g>
    <text x="430" y="330" font-weight="bold" fill="#8a7c55">¾ in ANGULAR crushed stone — tamped in 3 in lifts, screeded FLAT AND LEVEL</text>
    <text x="430" y="350" fill="#8a7c55">the whole 16 ft × 7 ft footprint is one pad — no pockets, no pedestals</text>
  </g>

  <!-- dashed future-wall footprint, coincident with the pad edge -->
  <rect x="100" y="200" width="614.4" height="268.8" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="10,6"/>
  <g font-size="13" fill="#8a8a8a">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <text x="245" y="392">dashed = future wall footprint —</text>
      <text x="245" y="408">the walls will sit on the deck above</text>
    </g>
    <text x="245" y="392">dashed = future wall footprint —</text>
    <text x="245" y="408">the walls will sit on the deck above</text>
  </g>

  <!-- skid lines: future this page, dashed -->
  <g fill="none" stroke="#8B6914" stroke-width="2.2" stroke-dasharray="9,5">
    <rect x="100" y="200" width="614.4" height="11.2"/>
    <rect x="100" y="457.6" width="614.4" height="11.2"/>
  </g>
  <g font-size="13" fill="#8B6914">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <text x="430" y="228">front skid line — 4×4 · 16 ft, no splice</text>
      <text x="430" y="452.4">back skid line</text>
    </g>
    <text x="430" y="228">front skid line — 4×4 · 16 ft, no splice</text>
    <text x="430" y="452.4">back skid line</text>
  </g>

  <!-- drop symbols: parts land by gravity -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <circle cx="349" cy="205.6" r="7"/><line x1="344" y1="200.6" x2="354" y2="210.6"/><line x1="354" y1="200.6" x2="344" y2="210.6"/>
    <circle cx="349" cy="463.2" r="7"/><line x1="344" y1="458.2" x2="354" y2="468.2"/><line x1="354" y1="458.2" x2="344" y2="468.2"/>
  </g>
  <text x="500" y="252" text-anchor="middle" font-size="13" fill="#c0392b">each skid beds DOWN on the screeded gravel — nothing fastens it</text>

  <!-- 1¾ in skid inset: leader label (too short for a true dimension at 3.2 px/in) -->
  <path d="M148,180 L108,203" stroke="#777" stroke-width="1.2" fill="none"/>
  <g font-size="13" fill="#444">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
      <text x="152" y="174">front skid centerline — 1¾ in in from the footprint edge;</text>
      <text x="152" y="190">the skid's outside face lands flush with the edge (back skid same)</text>
    </g>
    <text x="152" y="174">front skid centerline — 1¾ in in from the footprint edge;</text>
    <text x="152" y="190">the skid's outside face lands flush with the edge (back skid same)</text>
  </g>

  <!-- cut line B-B, viewed toward the right end -->
  <line x1="230" y1="130" x2="230" y2="500" stroke="#333" stroke-width="2.6" stroke-dasharray="14,5,3,5"/>
  <path d="M248,126 L236,120 L236,132 Z" fill="#333"/>
  <path d="M248,504 L236,498 L236,510 Z" fill="#333"/>
  <text x="256" y="131" font-size="15" font-weight="bold" fill="#333">B</text>
  <text x="256" y="509" font-size="15" font-weight="bold" fill="#333">B</text>
  <text x="274" y="131" font-size="13" fill="#333">B–B → section across the pad and front skid, Fig 4.2</text>

  <!-- overall length, tape from the left-end corner -->
  <g stroke="#999" stroke-width="1">
    <line x1="100" y1="472" x2="100" y2="544"/>
    <line x1="714.4" y1="472" x2="714.4" y2="544"/>
  </g>
  <line x1="100" y1="540" x2="714.4" y2="540" stroke="#444" stroke-width="1.4" marker-start="url(#dim04as)" marker-end="url(#dim04a)"/>
  <g font-size="13" text-anchor="middle">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-weight="bold">
      <text x="407" y="532">16 ft — overall length, read on the tape from the LEFT-end corner</text>
    </g>
    <text x="407" y="532" font-weight="bold" fill="#2b2b2b">16 ft — overall length, read on the tape from the LEFT-end corner</text>
  </g>
  <text x="407" y="562" text-anchor="middle" font-size="13" fill="#555">pad and footprint are the same rectangle — mark both at once</text>

  <!-- depth, front edge to back edge -->
  <g stroke="#999" stroke-width="1">
    <line x1="76" y1="200" x2="98" y2="200"/>
    <line x1="76" y1="468.8" x2="98" y2="468.8"/>
  </g>
  <line x1="80" y1="200" x2="80" y2="468.8" stroke="#444" stroke-width="1.4" marker-start="url(#dim04as)" marker-end="url(#dim04a)"/>
  <text x="66" y="334" font-size="13" fill="#444" transform="rotate(-90,66,334)" text-anchor="middle">7 ft — front edge to back edge</text>

  <!-- skid row spacing, centerline to centerline -->
  <line x1="735" y1="205.6" x2="735" y2="463.2" stroke="#444" stroke-width="1.4" marker-start="url(#dim04as)" marker-end="url(#dim04a)"/>
  <line x1="700" y1="205.6" x2="742" y2="205.6" stroke="#999" stroke-width="1"/>
  <line x1="700" y1="463.2" x2="742" y2="463.2" stroke="#999" stroke-width="1"/>
  <text x="752" y="334" font-size="13" fill="#444" transform="rotate(90,752,334)" text-anchor="middle">skid centerlines 6 ft 8½ in apart, centre to centre</text>

  <!-- end markers -->
  <text x="34" y="430" font-size="13" fill="#2b2b2b" transform="rotate(-90,34,430)">LEFT END — tape zero</text>
  <text x="776" y="430" font-size="13" fill="#2b2b2b" transform="rotate(-90,776,430)">RIGHT END</text>

  <!-- legend -->
  <g font-size="13" fill="#444">
    <rect x="100" y="600" width="580" height="40" fill="#fafaf8" stroke="#ddd" rx="5"/>
    <rect x="112" y="612" width="18" height="14" fill="url(#pad04a)" stroke="#8a7c55" stroke-width="1.4"/>
    <text x="136" y="623">compacted gravel pad</text>
    <line x1="310" y1="619" x2="338" y2="619" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="8,5"/>
    <text x="344" y="623">future wall footprint</text>
    <line x1="500" y1="619" x2="528" y2="619" stroke="#8B6914" stroke-width="2.2" stroke-dasharray="9,5"/>
    <text x="534" y="623">skid row</text>
  </g>
</svg>
