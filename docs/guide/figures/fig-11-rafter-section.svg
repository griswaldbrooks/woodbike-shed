  <text x="8" y="110"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">checked at Stage 9</text>
  <text x="8" y="110"  class="small">checked at Stage 9</text>
  <line x1="116" y1="58" x2="130" y2="57" stroke="#555" stroke-width="1"/>
