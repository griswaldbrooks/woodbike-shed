  <text x="250" y="140"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">rafter · 2×6 · 9' 7⅜″ (hatched — cut by the section plane)</text>
  <text x="250" y="140"  class="lbl">rafter · 2×6 · 9' 7⅜″ (hatched — cut by the section plane)</text>
