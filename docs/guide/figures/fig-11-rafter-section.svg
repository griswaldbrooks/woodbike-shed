<?xml version="1.0" encoding="UTF-8"?>
<!-- model trace: section in the Y-Z plane through one rafter; horizontal = y (front wall
     inner face y 0, back wall y 77..80.5), vertical = z above deck. Mapping X(y)=66+5.414*(y+27.5),
     Y(z)=436-2.85*z. Rafter profile per cad.roof.rafter_profile: tails y -15.5/92.5 (bottom
     z 127.3125/86.8125, top z 133.1865/92.6865); front seat z 123 over y -4..0 with 1.5 kick
     at y 0; back seat z 92.625 over y 77..80.5 with 1.3125 kick at y 80.5. Walls grey =
     already built. -->
<svg viewBox="0 0 840 490" width="210mm" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#555"/>
    </marker>
    <marker id="dimAs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#555"/>
    </marker>
    <marker id="attA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#1a6fb0"/>
    </marker>
    <marker id="grvA" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8" fill="#222"/>
    </marker>
    <pattern id="h11" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M0,7 L7,0" stroke="#8a6d3b" stroke-width="0.9"/>
    </pattern>
    <style>
      text { fill:#222; }
      .lbl { font-size:13px; }
      .lblb { font-size:13px; font-weight:bold; }
      .small { font-size:12px; }
    </style>
  </defs>

  <!-- view badge -->
  <rect x="470" y="10" width="358" height="62" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="482" y="30" class="lblb">SECTION B–B · through one rafter</text>
  <text x="482" y="47" class="lbl">viewed from the left gable end</text>
  <text x="482" y="64" class="small">frame anchor: gravity ↓ · cut plane shown in Fig 11.1</text>

  <!-- deck line + datum + gravity -->
  <rect x="40" y="436" width="760" height="9" fill="#c9b98f" stroke="#8a744a" stroke-width="1.2"/>
  <line x1="40" y1="436" x2="800" y2="436" stroke="#5c4d2c" stroke-width="2"/>
  <text x="330" y="460"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">deck top — the guide's height datum</text>
  <text x="330" y="460"  class="lbl">deck top — the guide's height datum</text>
  <line x1="795" y1="452" x2="795" y2="478" stroke="#222" stroke-width="2" marker-end="url(#grvA)"/>
  <text x="776" y="487" class="small">DOWN</text>
  <text x="110" y="487"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">◀ FRONT — street side (high)</text>
  <text x="110" y="487"  class="small">◀ FRONT — street side (high)</text>
  <text x="590" y="487"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">BACK (low) ▶</text>
  <text x="590" y="487"  class="small">BACK (low) ▶</text>

