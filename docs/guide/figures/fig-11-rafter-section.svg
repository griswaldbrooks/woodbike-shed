  <line x1="193.2" y1="85.45" x2="214.9" y2="85.45" stroke="#c0392b" stroke-width="3"/>
  <line x1="631.8" y1="172.0" x2="650.7" y2="172.0" stroke="#c0392b" stroke-width="3"/>

