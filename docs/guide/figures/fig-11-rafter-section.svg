  <line x1="150" y1="142" x2="198" y2="87" stroke="#555" stroke-width="1"/>
  <text x="232" y="118"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">heel — 4″ outboard of the wall face</text>
  <text x="232" y="118"  class="lbl">heel — 4″ outboard of the wall face</text>
  <line x1="230" y1="114" x2="195" y2="86" stroke="#555" stroke-width="1"/>

  <!-- back birdsmouth labels -->
  <text x="660" y="248"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">back birdsmouth</text>
  <text x="660" y="248"  class="lblb">back birdsmouth</text>
  <text x="660" y="266"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">level seat 3½″ long on the</text>
  <text x="660" y="266"  class="lbl">level seat 3½″ long on the</text>
  <text x="660" y="282"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">back plate top — 92⅝″</text>
  <text x="660" y="282"  class="lbl">back plate top — 92⅝″</text>
  <text x="660" y="298"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">above deck · plumb kick</text>
  <text x="660" y="298"  class="lbl">above deck · plumb kick</text>
  <text x="660" y="314"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">1-5/16″ at the outer face</text>
  <text x="660" y="314"  class="lbl">1-5/16″ at the outer face</text>
  <line x1="655" y1="240" x2="645" y2="178" stroke="#555" stroke-width="1"/>

  <!-- overhang dimensions -->
  <line x1="131" y1="40" x2="195.9" y2="40" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="131" y1="34" x2="131" y2="54" stroke="#555" stroke-width="1"/>
  <line x1="195.9" y1="34" x2="195.9" y2="82" stroke="#555" stroke-width="1"/>
  <text x="163.5" y="28"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">12″ overhang</text>
