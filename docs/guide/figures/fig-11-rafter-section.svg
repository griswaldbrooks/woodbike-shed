  <text x="330" y="88"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" transform="rotate(11.2 330 88)">roof pitch 4½ in 12 (20.6°)</text>
  <text x="330" y="88"  class="lbl" transform="rotate(11.2 330 88)">roof pitch 4½ in 12 (20.6°)</text>

