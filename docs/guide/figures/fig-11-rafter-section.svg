  <text x="626" y="360"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" transform="rotate(-90 626 360)">back wall — plate top 92⅝″ above deck</text>
  <text x="626" y="360"  class="small" transform="rotate(-90 626 360)">back wall — plate top 92⅝″ above deck</text>

