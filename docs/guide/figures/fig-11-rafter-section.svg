  <text x="290" y="378"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">toe-nail or screw through the plate into the rafter</text>
  <text x="290" y="378"  class="lbl" fill="#1a6fb0">toe-nail or screw through the plate into the rafter</text>
  <line x1="310" y1="348" x2="206" y2="90" stroke="#1a6fb0" stroke-width="1.8" marker-end="url(#attA)"/>
  <line x1="520" y1="348" x2="638" y2="178" stroke="#1a6fb0" stroke-width="1.8" marker-end="url(#attA)"/>
</svg>
