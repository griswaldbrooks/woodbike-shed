<svg viewBox="0 0 920 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- model trace: front wall elevation; px(t)=150+3.5*t (t = inches from left end, model x+3.5);
y(z)=560-3.5*z (z = inches above deck). Barn opening clear x 0..96 (t 3.5..99.5);
head z 84; header top z 89; header x -1.5..97.5 borne west on the corner post;
top plate z 120..121.5; DTP z 121.5..123; east of x 96 solid wall at 16" oc -->
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
  </marker>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#444"/>
  </marker>
</defs>

<rect x="0" y="0" width="920" height="660" fill="#ffffff"/>

<!-- view badge -->
<g>
  <rect x="14" y="12" width="298" height="76" fill="#ffffff" stroke="#222" stroke-width="2.5" rx="6"/>
  <text x="26" y="36" font-size="17" font-weight="bold" fill="#111">ELEVATION · FRONT WALL</text>
  <text x="26" y="57" font-size="15" fill="#111">viewed from the street (outside)</text>
  <text x="26" y="78" font-size="15" fill="#111">frame anchor: gravity</text>
  <line x1="286" y1="46" x2="286" y2="72" stroke="#111" stroke-width="3"/>
  <path d="M279,68 L286,80 L293,68 z" fill="#111"/>
</g>

<!-- deck line + ground hatch -->
<line x1="80" y1="560" x2="880" y2="560" stroke="#222" stroke-width="3"/>
<g stroke="#666" stroke-width="1.6">
  <line x1="90" y1="560" x2="78" y2="574"/><line x1="130" y1="560" x2="118" y2="574"/>
  <line x1="170" y1="560" x2="158" y2="574"/><line x1="210" y1="560" x2="198" y2="574"/>
  <line x1="250" y1="560" x2="238" y2="574"/><line x1="290" y1="560" x2="278" y2="574"/>
  <line x1="330" y1="560" x2="318" y2="574"/><line x1="370" y1="560" x2="358" y2="574"/>
  <line x1="410" y1="560" x2="398" y2="574"/><line x1="450" y1="560" x2="438" y2="574"/>
  <line x1="490" y1="560" x2="478" y2="574"/><line x1="530" y1="560" x2="518" y2="574"/>
  <line x1="570" y1="560" x2="558" y2="574"/><line x1="610" y1="560" x2="598" y2="574"/>
  <line x1="650" y1="560" x2="638" y2="574"/><line x1="690" y1="560" x2="678" y2="574"/>
  <line x1="730" y1="560" x2="718" y2="574"/><line x1="770" y1="560" x2="758" y2="574"/>
  <line x1="810" y1="560" x2="798" y2="574"/><line x1="850" y1="560" x2="838" y2="574"/>
</g>
<text x="84" y="592" font-size="15" fill="#333">deck top (Stage 2) — plate line = front edge</text>

<!-- plates -->
<rect x="150" y="554.75" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="150" y="134.75" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="150" y="129.5" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- king studs 118.5 (z 1.5..120 -> y 554.75..140): corner, 97.5, 113.5, 129.5, 145.5, 161.5, 177.5, corner east -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="150" y="140" width="5.25" height="414.75"/>
  <rect x="503.5" y="140" width="5.25" height="414.75"/>
  <rect x="559.5" y="140" width="5.25" height="414.75"/>
  <rect x="615.5" y="140" width="5.25" height="414.75"/>
  <rect x="671.5" y="140" width="5.25" height="414.75"/>
  <rect x="727.5" y="140" width="5.25" height="414.75"/>
  <rect x="783.5" y="140" width="5.25" height="414.75"/>
  <rect x="816.75" y="140" width="5.25" height="414.75"/>
</g>

<!-- jacks 82.5, on plate: corner jack (x -1.5) and east jack (x 96) -->
<rect x="157" y="266" width="5.25" height="288.75" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="498.25" y="266" width="5.25" height="288.75" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- header x -1.5..97.5: face-pair band z 84..87.5 + cap band z 87.5..89 -->
<g fill="#b98a45" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="157" y="253.75" width="346.5" height="12.25"/>
  <rect x="157" y="248.5" width="346.5" height="5.25"/>
</g>

<!-- cripples z 89..120 -> y 248.5..140 at x 14.5/30.5/46.5/62.5/78.5 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="213" y="140" width="5.25" height="108.5"/>
  <rect x="269" y="140" width="5.25" height="108.5"/>
  <rect x="325" y="140" width="5.25" height="108.5"/>
  <rect x="381" y="140" width="5.25" height="108.5"/>
  <rect x="437" y="140" width="5.25" height="108.5"/>
</g>

<!-- attachment arrows: header seats on the corner post and the east jack; cripples seat on the header -->
<g stroke="#b03a2e" stroke-width="2.4" fill="none">
  <line x1="166" y1="228" x2="162" y2="246" marker-end="url(#arr)"/>
  <line x1="492" y1="228" x2="499" y2="246" marker-end="url(#arr)"/>
  <line x1="330" y1="176" x2="340" y2="240" marker-end="url(#arr)"/>
</g>
<!-- nailed-joint symbols at plates (representative) -->
<g stroke="#7a2e12" stroke-width="2">
  <line x1="556" y1="551" x2="564" y2="559"/><line x1="564" y1="551" x2="556" y2="559"/>
  <line x1="724" y1="551" x2="732" y2="559"/><line x1="732" y1="551" x2="724" y2="559"/>
  <line x1="556" y1="126" x2="564" y2="134"/><line x1="564" y1="126" x2="556" y2="134"/>
  <line x1="813" y1="126" x2="821" y2="134"/><line x1="821" y1="126" x2="813" y2="134"/>
</g>

<!-- opening label -->
<text x="330" y="330" font-size="15" text-anchor="middle" fill="#222">8' 0" clear</text>
<text x="330" y="349" font-size="15" text-anchor="middle" fill="#222">barn door — centre double</text>
<text x="660" y="330" font-size="15" text-anchor="middle" fill="#666">solid wall east of the barn</text>
<text x="660" y="349" font-size="13.5" text-anchor="middle" fill="#666">kings at 16" on centre</text>

<!-- part labels with leaders -->
<g font-size="16" fill="#111">
  <line x1="615" y1="132" x2="560" y2="106" stroke="#444" stroke-width="1.4"/>
  <text x="380" y="102">double top plate · 2×4 · 16' 0"</text>
  <line x1="700" y1="137" x2="740" y2="112" stroke="#444" stroke-width="1.4"/>
  <text x="744" y="110">top plate · 2×4 · 16' 0"</text>
  <line x1="618" y1="300" x2="570" y2="300" stroke="#444" stroke-width="1.4"/>
  <text x="566" y="304" font-size="15" text-anchor="end">king stud · 2×4 · 9' 10½"</text>
  <line x1="500" y1="518" x2="505" y2="500" stroke="#444" stroke-width="1.4"/>
  <text x="560" y="525" font-size="15">jack · 2×4 · 6' 10½"</text>
  <text x="560" y="543" font-size="13.5" fill="#666">sits on plate</text>
  <line x1="330" y1="256" x2="330" y2="216" stroke="#444" stroke-width="1.4"/>
  <text x="336" y="212" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">header · 3 × 2×4 · 8' 3"</text>
  <text x="336" y="212" font-size="15">header · 3 × 2×4 · 8' 3"</text>
  <line x1="440" y1="180" x2="440" y2="160" stroke="#444" stroke-width="1.4"/>
  <text x="446" y="156" font-size="15">cripple · 2×4 · 2' 7"</text>
  <line x1="158" y1="470" x2="120" y2="470" stroke="#444" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <text x="20" y="452" font-size="15">corner post</text>
    <text x="20" y="470" font-size="13.5">corner king + corner jack,</text>
    <text x="20" y="487" font-size="13.5">built-up; carries the header's</text>
    <text x="20" y="504" font-size="13.5">west end (flagged)</text>
  </g>
  <text x="20" y="452" font-size="15">corner post</text>
  <text x="20" y="470" font-size="13.5" fill="#666">corner king + corner jack,</text>
  <text x="20" y="487" font-size="13.5" fill="#666">built-up; carries the header's</text>
  <text x="20" y="504" font-size="13.5" fill="#666">west end (flagged)</text>
  <line x1="600" y1="585" x2="600" y2="563" stroke="#444" stroke-width="1.4"/>
  <text x="500" y="592" font-size="15">bottom plate · 2×4 · 16' 0"</text>
</g>

<!-- dimensions -->
<g stroke="#444" stroke-width="1.4" font-size="15" fill="#222">
  <line x1="150" y1="616" x2="822" y2="616" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="150" y1="608" x2="150" y2="624"/><line x1="822" y1="608" x2="822" y2="624"/>
  <text x="486" y="640" text-anchor="middle">16' 0" overall, measured from the left end</text>
  <line x1="856" y1="560" x2="856" y2="129.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="848" y1="560" x2="864" y2="560"/><line x1="848" y1="129.5" x2="864" y2="129.5"/>
  <text x="874" y="352" transform="rotate(-90,874,352)" text-anchor="middle">10' 3" deck to plate top</text>
  <line x1="120" y1="560" x2="120" y2="266" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="112" y1="266" x2="128" y2="266"/>
  <text x="102" y="420" transform="rotate(-90,102,420)" text-anchor="middle">7' 0" head</text>
  <line x1="162.25" y1="112" x2="498.25" y2="112" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="162.25" y1="106" x2="162.25" y2="118"/><line x1="498.25" y1="106" x2="498.25" y2="118"/>
  <text x="330" y="105" text-anchor="middle">8' 0" clear between jamb faces</text>
</g>
</svg>
