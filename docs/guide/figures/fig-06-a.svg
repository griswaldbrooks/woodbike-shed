<svg viewBox="0 0 920 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- model trace: front wall elevation; px(t)=150+3.5*t (t = inches from left end, model x+3.5);
y(z)=560-3.5*z (z = inches above deck). Opening A RO t 19..55; opening B RO t 102.5..174.5;
heads z 84; header tops z 89; top plate z 120..121.5; DTP z 121.5..123 -->
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
  </marker>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#444"/>
  </marker>
</defs>

<rect x="0" y="0" width="920" height="660" fill="#ffffff"/>

<!-- view badge -->
<g>
  <rect x="14" y="12" width="298" height="76" fill="#ffffff" stroke="#222" stroke-width="2.5" rx="6"/>
  <text x="26" y="36" font-size="17" font-weight="bold" fill="#111">ELEVATION · FRONT WALL</text>
  <text x="26" y="57" font-size="15" fill="#111">viewed from the street (outside)</text>
  <text x="26" y="78" font-size="15" fill="#111">frame anchor: gravity</text>
  <line x1="286" y1="46" x2="286" y2="72" stroke="#111" stroke-width="3"/>
  <path d="M279,68 L286,80 L293,68 z" fill="#111"/>
</g>

<!-- deck line + ground hatch -->
<line x1="80" y1="560" x2="880" y2="560" stroke="#222" stroke-width="3"/>
<g stroke="#666" stroke-width="1.6">
  <line x1="90" y1="560" x2="78" y2="574"/><line x1="130" y1="560" x2="118" y2="574"/>
  <line x1="170" y1="560" x2="158" y2="574"/><line x1="210" y1="560" x2="198" y2="574"/>
  <line x1="250" y1="560" x2="238" y2="574"/><line x1="290" y1="560" x2="278" y2="574"/>
  <line x1="330" y1="560" x2="318" y2="574"/><line x1="370" y1="560" x2="358" y2="574"/>
  <line x1="410" y1="560" x2="398" y2="574"/><line x1="450" y1="560" x2="438" y2="574"/>
  <line x1="490" y1="560" x2="478" y2="574"/><line x1="530" y1="560" x2="518" y2="574"/>
  <line x1="570" y1="560" x2="558" y2="574"/><line x1="610" y1="560" x2="598" y2="574"/>
  <line x1="650" y1="560" x2="638" y2="574"/><line x1="690" y1="560" x2="678" y2="574"/>
  <line x1="730" y1="560" x2="718" y2="574"/><line x1="770" y1="560" x2="758" y2="574"/>
  <line x1="810" y1="560" x2="798" y2="574"/><line x1="850" y1="560" x2="838" y2="574"/>
</g>
<text x="84" y="592" font-size="15" fill="#333">deck top (Stage 2) — plate line = front edge</text>

<!-- plates -->
<rect x="150" y="554.75" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="150" y="134.75" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="150" y="129.5" width="672" height="5.25" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- king studs 118.5 (z 1.5..120 -> y 554.75..140) -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="150" y="140" width="5.25" height="414.75"/>
  <rect x="206" y="140" width="5.25" height="414.75"/>
  <rect x="374" y="140" width="5.25" height="414.75"/>
  <rect x="430" y="140" width="5.25" height="414.75"/>
  <rect x="486" y="140" width="5.25" height="414.75"/>
  <rect x="498.25" y="140" width="5.25" height="414.75"/>
  <rect x="766" y="140" width="5.25" height="414.75"/>
  <rect x="816.75" y="140" width="5.25" height="414.75"/>
</g>
<!-- tall king 120, runs to deck (t 56.5) -->
<rect x="347.75" y="140" width="5.25" height="420" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- jacks opening A (84, to deck, t 17.5 and 55) -->
<rect x="211.25" y="266" width="5.25" height="294" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="342.5" y="266" width="5.25" height="294" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>
<!-- jacks opening B (82.5, on plate, t 101 and 174.5) -->
<rect x="503.5" y="266" width="5.25" height="288.75" fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="760.75" y="266" width="5.25" height="288.75" fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- headers: face-pair band z 84..87.5 + cap band z 87.5..89 -->
<g fill="#b98a45" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="211.25" y="253.75" width="136.5" height="12.25"/>
  <rect x="211.25" y="248.5" width="136.5" height="5.25"/>
  <rect x="503.5" y="253.75" width="262.5" height="12.25"/>
  <rect x="503.5" y="248.5" width="262.5" height="5.25"/>
</g>

<!-- cripples z 89..120 -> y 248.5..140 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="262" y="140" width="5.25" height="108.5"/>
  <rect x="318" y="140" width="5.25" height="108.5"/>
  <rect x="542" y="140" width="5.25" height="108.5"/>
  <rect x="598" y="140" width="5.25" height="108.5"/>
  <rect x="654" y="140" width="5.25" height="108.5"/>
  <rect x="710" y="140" width="5.25" height="108.5"/>
</g>

<!-- attachment arrows: headers seat on jacks; cripples seat on headers -->
<g stroke="#b03a2e" stroke-width="2.4" fill="none">
  <line x1="222" y1="228" x2="215" y2="246" marker-end="url(#arr)"/>
  <line x1="332" y1="228" x2="339" y2="246" marker-end="url(#arr)"/>
  <line x1="276" y1="176" x2="286" y2="240" marker-end="url(#arr)"/>
  <line x1="516" y1="228" x2="507" y2="246" marker-end="url(#arr)"/>
  <line x1="750" y1="228" x2="757" y2="246" marker-end="url(#arr)"/>
  <line x1="612" y1="176" x2="622" y2="240" marker-end="url(#arr)"/>
</g>
<!-- nailed-joint symbols at plates (representative) -->
<g stroke="#7a2e12" stroke-width="2">
  <line x1="203" y1="551" x2="211" y2="559"/><line x1="211" y1="551" x2="203" y2="559"/>
  <line x1="427" y1="551" x2="435" y2="559"/><line x1="435" y1="551" x2="427" y2="559"/>
  <line x1="763" y1="551" x2="771" y2="559"/><line x1="771" y1="551" x2="763" y2="559"/>
  <line x1="203" y1="126" x2="211" y2="134"/><line x1="211" y1="126" x2="203" y2="134"/>
  <line x1="483" y1="126" x2="491" y2="134"/><line x1="491" y1="126" x2="483" y2="134"/>
  <line x1="813" y1="126" x2="821" y2="134"/><line x1="821" y1="126" x2="813" y2="134"/>
</g>

<!-- opening labels -->
<text x="279" y="330" font-size="15" text-anchor="middle" fill="#222">3' 0" clear</text>
<text x="279" y="349" font-size="15" text-anchor="middle" fill="#222">single door</text>
<text x="279" y="372" font-size="13.5" text-anchor="middle" fill="#666">no sill — plate piece</text>
<text x="279" y="389" font-size="13.5" text-anchor="middle" fill="#666">sawn out after raising (Stage 6)</text>
<text x="634" y="330" font-size="15" text-anchor="middle" fill="#222">6' 0" clear</text>
<text x="634" y="349" font-size="15" text-anchor="middle" fill="#222">double door</text>
<text x="634" y="372" font-size="13.5" text-anchor="middle" fill="#666">sill stays</text>

<!-- part labels with leaders -->
<g font-size="16" fill="#111">
  <line x1="486" y1="132" x2="430" y2="106" stroke="#444" stroke-width="1.4"/>
  <text x="288" y="102">double top plate · 2×4 · 16' 0"</text>
  <line x1="600" y1="137" x2="664" y2="112" stroke="#444" stroke-width="1.4"/>
  <text x="668" y="110">top plate · 2×4 · 16' 0"</text>
  <line x1="430" y1="300" x2="379" y2="300" stroke="#444" stroke-width="1.4"/>
  <text x="122" y="304" font-size="15">king stud · 2×4 · 9' 10½"</text>
  <line x1="232" y1="522" x2="346" y2="500" stroke="#444" stroke-width="1.4"/>
  <text x="34" y="520" font-size="15">tall king · 2×4 · 10' 0"</text>
  <text x="34" y="538" font-size="13.5" fill="#666">runs down to the deck</text>
  <line x1="213" y1="480" x2="188" y2="480" stroke="#444" stroke-width="1.4"/>
  <text x="34" y="476" font-size="15">jack · 2×4 · 7' 0"</text>
  <text x="34" y="494" font-size="13.5" fill="#666">runs to deck</text>
  <line x1="748" y1="518" x2="763" y2="500" stroke="#444" stroke-width="1.4"/>
  <text x="745" y="525" font-size="15" text-anchor="end">jack · 2×4 · 6' 10½"</text>
  <text x="745" y="543" font-size="13.5" fill="#666" text-anchor="end">sits on plate</text>
  <line x1="560" y1="256" x2="560" y2="216" stroke="#444" stroke-width="1.4"/>
  <text x="566" y="212" font-size="15">header · 3 × 2×4 · 6' 3"</text>
  <line x1="290" y1="252" x2="160" y2="222" stroke="#444" stroke-width="1.4"/>
  <text x="34" y="218" font-size="15">header · 3 × 2×4 · 3' 3"</text>
  <line x1="644" y1="180" x2="710" y2="180" stroke="#444" stroke-width="1.4"/>
  <text x="640" y="184" font-size="15" text-anchor="end">cripple · 2×4 · 2' 7"</text>
  <line x1="600" y1="585" x2="600" y2="563" stroke="#444" stroke-width="1.4"/>
  <text x="500" y="592" font-size="15">bottom plate · 2×4 · 16' 0"</text>
</g>

<!-- dimensions -->
<g stroke="#444" stroke-width="1.4" font-size="15" fill="#222">
  <line x1="150" y1="616" x2="822" y2="616" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="150" y1="608" x2="150" y2="624"/><line x1="822" y1="608" x2="822" y2="624"/>
  <text x="486" y="640" text-anchor="middle">16' 0" overall, measured from the left end</text>
  <line x1="856" y1="560" x2="856" y2="129.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="848" y1="560" x2="864" y2="560"/><line x1="848" y1="129.5" x2="864" y2="129.5"/>
  <text x="874" y="352" transform="rotate(-90,874,352)" text-anchor="middle">10' 3" deck to plate top</text>
  <line x1="120" y1="560" x2="120" y2="266" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="112" y1="266" x2="128" y2="266"/>
  <text x="102" y="420" transform="rotate(-90,102,420)" text-anchor="middle">7' 0" head</text>
</g>
</svg>
