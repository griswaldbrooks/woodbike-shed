<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- model trace: right wall, interior view (facing +x): front/street end (y 0) drawn RIGHT,
back end (y 65) left. px(t)=560-4*t, t = inches from the front end; y(z)=600-4*z.
Plate pieces t 0..8.5 and 44.5..65; jacks t 7..8.5 and 44.5..46 z 1.5..84; header spanning
t 7..46, z 84..89; cripples t 19..20.5 and 32.5..34 z 89..94.125; RO t 8.5..44.5 -->
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
  </marker>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#444"/>
  </marker>
</defs>

<rect x="0" y="0" width="720" height="680" fill="#ffffff"/>

<!-- view badge -->
<g>
  <rect x="14" y="12" width="366" height="76" fill="#ffffff" stroke="#222" stroke-width="2.5" rx="6"/>
  <text x="26" y="36" font-size="16.5" font-weight="bold" fill="#111">ELEVATION · RIGHT WALL</text>
  <text x="26" y="57" font-size="14.5" fill="#111">viewed from inside the shed (front end at right)</text>
  <text x="26" y="78" font-size="14.5" fill="#111">frame anchor: gravity</text>
  <line x1="354" y1="46" x2="354" y2="70" stroke="#111" stroke-width="3"/>
  <path d="M347,66 L354,78 L361,66 z" fill="#111"/>
</g>

<!-- deck line + hatch -->
<line x1="260" y1="600" x2="650" y2="600" stroke="#222" stroke-width="3"/>
<g stroke="#666" stroke-width="1.6">
  <line x1="272" y1="600" x2="260" y2="614"/><line x1="312" y1="600" x2="300" y2="614"/>
  <line x1="352" y1="600" x2="340" y2="614"/><line x1="392" y1="600" x2="380" y2="614"/>
  <line x1="432" y1="600" x2="420" y2="614"/><line x1="472" y1="600" x2="460" y2="614"/>
  <line x1="512" y1="600" x2="500" y2="614"/><line x1="552" y1="600" x2="540" y2="614"/>
  <line x1="592" y1="600" x2="580" y2="614"/><line x1="632" y1="600" x2="620" y2="614"/>
</g>
<text x="646" y="634" font-size="15" fill="#222" text-anchor="end" font-weight="bold">FRONT end (street)</text>
<text x="264" y="634" font-size="15" fill="#222">BACK end</text>

<!-- split bottom plate -->
<rect x="526" y="594" width="34" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="300" y="594" width="82" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- studs z 1.5..94.125 -> y 594..223.5 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="554" y="223.5" width="6" height="370.5"/>
  <rect x="532" y="223.5" width="6" height="370.5"/>
  <rect x="370" y="223.5" width="6" height="370.5"/>
  <rect x="334" y="223.5" width="6" height="370.5"/>
  <rect x="300" y="223.5" width="6" height="370.5"/>
</g>

<!-- jacks z 1.5..84 -> y 594..264 -->
<rect x="526" y="264" width="6" height="330" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="376" y="264" width="6" height="330" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- header: face pair z 84..87.5 (y 264..250) + cap z 87.5..89 (y 250..244) -->
<rect x="376" y="250" width="156" height="14" fill="#b98a45" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="376" y="244" width="156" height="6" fill="#a87c3d" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- cripples z 89..94.125 -> y 244..223.5 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="478" y="223.5" width="6" height="20.5"/>
  <rect x="424" y="223.5" width="6" height="20.5"/>
</g>

<!-- top plate + double top plate (lap 286..300 highlighted) -->
<rect x="300" y="217.5" width="260" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="286" y="211.5" width="274" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="286" y="211.5" width="14" height="6" fill="#e8c07a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- attachment arrows: header seats on jacks; cripples seat on header -->
<g stroke="#b03a2e" stroke-width="2.4" fill="none">
  <line x1="398" y1="222" x2="383" y2="242" marker-end="url(#arr)"/>
  <line x1="510" y1="222" x2="525" y2="242" marker-end="url(#arr)"/>
  <line x1="454" y1="188" x2="454" y2="236" marker-end="url(#arr)"/>
</g>
<!-- nailed joints (representative) -->
<g stroke="#7a2e12" stroke-width="2">
  <line x1="331" y1="590" x2="339" y2="598"/><line x1="339" y1="590" x2="331" y2="598"/>
  <line x1="551" y1="590" x2="559" y2="598"/><line x1="559" y1="590" x2="551" y2="598"/>
  <line x1="331" y1="212" x2="339" y2="220"/><line x1="339" y1="212" x2="331" y2="220"/>
  <line x1="551" y1="212" x2="559" y2="220"/><line x1="559" y1="212" x2="551" y2="220"/>
</g>

<!-- opening label + head line -->
<text x="454" y="330" font-size="15" text-anchor="middle" fill="#222">3' 0" clear · single door</text>
<text x="454" y="352" font-size="13.5" text-anchor="middle" fill="#666">no sill — open to the deck</text>
<line x1="532" y1="264" x2="640" y2="264" stroke="#444" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="644" y="260" font-size="14.5" fill="#222">7' 0"</text>
<text x="644" y="278" font-size="14.5" fill="#222">head</text>

<!-- labels -->
<g font-size="15.5" fill="#111">
  <line x1="554" y1="420" x2="508" y2="400" stroke="#444" stroke-width="1.4"/>
  <text x="404" y="396">stud · 2×4 ·</text>
  <text x="404" y="415">7' 8⅝" pre-cut</text>
  <line x1="526" y1="500" x2="508" y2="492" stroke="#444" stroke-width="1.4"/>
  <text x="404" y="488">jack · 2×4 ·</text>
  <text x="404" y="507">6' 10½" × 2</text>
  <line x1="430" y1="247" x2="380" y2="180" stroke="#444" stroke-width="1.4"/>
  <text x="96" y="176">header · 3 × 2×4 · 3' 3"</text>
  <line x1="481" y1="232" x2="500" y2="184" stroke="#444" stroke-width="1.4"/>
  <text x="504" y="180">cripple · 2×4 · 5⅛" × 2</text>
  <line x1="340" y1="597" x2="300" y2="560" stroke="#444" stroke-width="1.4"/>
  <text x="34" y="556">bottom plate long · 1' 8½"</text>
  <text x="566" y="580">short · 8½"</text>
  <line x1="293" y1="214" x2="220" y2="252" stroke="#444" stroke-width="1.4"/>
  <text x="16" y="268">double top plate · 5' 8½" —</text>
  <text x="16" y="287" font-size="13.5" fill="#666">3½" lap over the back corner</text>
</g>

<!-- dimensions -->
<g stroke="#444" stroke-width="1.4" font-size="15" fill="#222">
  <line x1="300" y1="656" x2="560" y2="656" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="300" y1="648" x2="300" y2="664"/><line x1="560" y1="648" x2="560" y2="664"/>
  <text x="430" y="678" text-anchor="middle">5' 5" overall</text>
  <line x1="688" y1="600" x2="688" y2="211.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="680" y1="600" x2="696" y2="600"/><line x1="680" y1="211.5" x2="696" y2="211.5"/>
  <text x="706" y="430" transform="rotate(-90,706,430)" text-anchor="middle">97⅛"</text>
</g>
</svg>
