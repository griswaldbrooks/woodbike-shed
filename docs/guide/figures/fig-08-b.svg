<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<!-- model trace: right wall, interior view (facing +x): front/street end (y 0) drawn RIGHT,
back end (y 80.5) left. px(t)=560-4*t, t = inches from the front end; y(z)=600-4*z.
Bottom plate pieces t 0..6.5 and 70.5..77; corner stud t 0..1.5 z 1.5..94.125; jacks t 5..6.5
and 70.5..72 z 1.5..84; header spanning t 5..72 z 84..89; flat cripples t 22.5/38.5/54.5
z 89..94.125; mitered cripples t 65.5/68.5 (Stage 7, dashed); top plate t 0..64.75; DTP
t 0..60.75; corner post t 77..78.5 z 1.5..89.625; DTP corner block t 77..80.5 z 91.125..92.625;
RO t 6.5..70.5 (64 in) -->
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
  </marker>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 z" fill="#444"/>
  </marker>
</defs>

<rect x="0" y="0" width="720" height="680" fill="#ffffff"/>

<!-- view badge -->
<g>
  <rect x="14" y="12" width="366" height="76" fill="#ffffff" stroke="#222" stroke-width="2.5" rx="6"/>
  <text x="26" y="36" font-size="16.5" font-weight="bold" fill="#111">ELEVATION · RIGHT WALL</text>
  <text x="26" y="57" font-size="14.5" fill="#111">viewed from inside the shed (front end at right)</text>
  <text x="26" y="78" font-size="14.5" fill="#111">frame anchor: gravity</text>
  <line x1="354" y1="46" x2="354" y2="70" stroke="#111" stroke-width="3"/>
  <path d="M347,66 L354,78 L361,66 z" fill="#111"/>
</g>

<!-- deck line + hatch -->
<line x1="230" y1="600" x2="650" y2="600" stroke="#222" stroke-width="3"/>
<g stroke="#666" stroke-width="1.6">
  <line x1="242" y1="600" x2="230" y2="614"/><line x1="282" y1="600" x2="270" y2="614"/>
  <line x1="322" y1="600" x2="310" y2="614"/><line x1="362" y1="600" x2="350" y2="614"/>
  <line x1="402" y1="600" x2="390" y2="614"/><line x1="442" y1="600" x2="430" y2="614"/>
  <line x1="482" y1="600" x2="470" y2="614"/><line x1="522" y1="600" x2="510" y2="614"/>
  <line x1="562" y1="600" x2="550" y2="614"/><line x1="602" y1="600" x2="590" y2="614"/>
  <line x1="642" y1="600" x2="630" y2="614"/>
</g>
<text x="646" y="634" font-size="15" fill="#222" text-anchor="end" font-weight="bold">FRONT end (street)</text>
<text x="234" y="634" font-size="15" fill="#222">BACK end</text>

<!-- split bottom plate -->
<rect x="534" y="594" width="26" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="252" y="594" width="26" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- corner stud z 1.5..94.125 -> y 594..223.5 -->
<rect x="554" y="223.5" width="6" height="370.5" fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- jacks z 1.5..84 -> y 594..264 -->
<rect x="534" y="264" width="6" height="330" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="272" y="264" width="6" height="330" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- header: face pair z 84..87.5 (y 264..250) + cap z 87.5..89 (y 250..244) -->
<rect x="272" y="250" width="268" height="14" fill="#b98a45" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="272" y="244" width="268" height="6" fill="#a87c3d" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- flat cripples z 89..94.125 -> y 244..223.5 -->
<g fill="#d9a763" stroke="#6b4a1f" stroke-width="2.2">
  <rect x="464" y="223.5" width="6" height="20.5"/>
  <rect x="400" y="223.5" width="6" height="20.5"/>
  <rect x="336" y="223.5" width="6" height="20.5"/>
</g>

<!-- mitered cripples over the header's back bay (Stage 7, dashed) -->
<g fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4">
  <rect x="292" y="228.5" width="6" height="15.5"/>
  <rect x="280" y="230" width="6" height="14"/>
</g>

<!-- corner post z 1.5..89.625 -> y 594..241.5 -->
<rect x="246" y="241.5" width="6" height="352.5" fill="#e0b06a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- top plate t 0..64.75 + DTP t 0..60.75 -->
<rect x="301" y="217.5" width="259" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>
<rect x="317" y="211.5" width="243" height="6" fill="#c99a56" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- DTP corner block t 77..80.5, z 91.125..92.625 -> y 234.5..228.5 -->
<rect x="238" y="228.5" width="14" height="6" fill="#e8c07a" stroke="#6b4a1f" stroke-width="2.2"/>

<!-- dashed: gable follows the roof above the plate ends (Stage 7) -->
<g stroke="#888" stroke-width="2" stroke-dasharray="7 5" fill="none">
  <line x1="317" y1="211.5" x2="252" y2="228.5"/>
  <line x1="252" y1="228.5" x2="238" y2="231"/>
</g>

<!-- attachment arrows: header seats on jacks; cripples seat on header -->
<g stroke="#b03a2e" stroke-width="2.4" fill="none">
  <line x1="520" y1="222" x2="533" y2="242" marker-end="url(#arr)"/>
  <line x1="296" y1="222" x2="283" y2="242" marker-end="url(#arr)"/>
  <line x1="430" y1="188" x2="430" y2="236" marker-end="url(#arr)"/>
</g>
<!-- nailed joints (representative) -->
<g stroke="#7a2e12" stroke-width="2">
  <line x1="551" y1="590" x2="559" y2="598"/><line x1="559" y1="590" x2="551" y2="598"/>
  <line x1="261" y1="590" x2="269" y2="598"/><line x1="269" y1="590" x2="261" y2="598"/>
  <line x1="551" y1="212" x2="559" y2="220"/><line x1="559" y1="212" x2="551" y2="220"/>
</g>

<!-- opening label + head line -->
<g text-anchor="middle">
  <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
    <text x="410" y="330" font-size="15">5' 4" clear · brewery centre double</text>
    <text x="410" y="352" font-size="13.5">no sill — open to the deck</text>
  </g>
  <text x="410" y="330" font-size="15" fill="#222">5' 4" clear · brewery centre double</text>
  <text x="410" y="352" font-size="13.5" fill="#666">no sill — open to the deck</text>
</g>
<line x1="540" y1="264" x2="640" y2="264" stroke="#444" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="644" y="260" font-size="14.5" fill="#222">7' 0"</text>
<text x="644" y="278" font-size="14.5" fill="#222">head</text>

<!-- labels -->
<g font-size="15.5" fill="#111">
  <line x1="554" y1="420" x2="508" y2="400" stroke="#444" stroke-width="1.4"/>
  <text x="404" y="396">corner stud · 2×4 ·</text>
  <text x="404" y="415">7' 8⅝" pre-cut</text>
  <line x1="534" y1="500" x2="508" y2="492" stroke="#444" stroke-width="1.4"/>
  <text x="404" y="488">jack · 2×4 ·</text>
  <text x="404" y="507">6' 10½" × 2</text>
  <line x1="420" y1="247" x2="380" y2="180" stroke="#444" stroke-width="1.4"/>
  <text x="96" y="176">header · 3 × 2×4 · 5' 7"</text>
  <line x1="467" y1="232" x2="486" y2="184" stroke="#444" stroke-width="1.4"/>
  <text x="490" y="180">cripple · 2×4 · 5⅛" × 3</text>
  <line x1="249" y1="470" x2="200" y2="470" stroke="#444" stroke-width="1.4"/>
  <text x="26" y="466">corner post · 2×4 · 7' 4⅛"</text>
  <text x="26" y="485" font-size="13.5" fill="#666">carries the corner rafter</text>
  <line x1="245" y1="231" x2="180" y2="262" stroke="#444" stroke-width="1.4"/>
  <text x="16" y="278">DTP corner block · 3½"</text>
  <line x1="300" y1="597" x2="280" y2="560" stroke="#444" stroke-width="1.4"/>
  <text x="150" y="556">bottom plate long · 6½"</text>
  <text x="566" y="580">short · 6½"</text>
  <line x1="500" y1="440" x2="534" y2="430" stroke="#444" stroke-width="1.4"/>
  <text x="410" y="418" font-size="13.5" fill="#666" text-anchor="middle">6½" end stud at each end (flagged)</text>
</g>

<!-- dimensions -->
<g stroke="#444" stroke-width="1.4" font-size="15" fill="#222">
  <line x1="238" y1="656" x2="560" y2="656" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="238" y1="648" x2="238" y2="664"/><line x1="560" y1="648" x2="560" y2="664"/>
  <text x="399" y="678" text-anchor="middle">6' 8½" overall</text>
  <line x1="280" y1="112" x2="534" y2="112" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="280" y1="106" x2="280" y2="118"/><line x1="534" y1="106" x2="534" y2="118"/>
  <text x="407" y="105" text-anchor="middle">5' 4" clear between jamb faces</text>
  <line x1="688" y1="600" x2="688" y2="211.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="680" y1="600" x2="696" y2="600"/><line x1="680" y1="211.5" x2="696" y2="211.5"/>
  <text x="706" y="430" transform="rotate(-90,706,430)" text-anchor="middle">97⅛" at the plate</text>
</g>
</svg>
