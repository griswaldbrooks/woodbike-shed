<?xml version="1.0" encoding="UTF-8"?>
<!-- model trace: elevation of left rake wall, interior view; horizontal = y 0 (front wall
     inner face, left) .. 68.5 (over the back wall, right); vertical = z above deck.
     Rake plate top edge = bearing line 121.5 .. 97.125; underside zu = zbot - 1.5*sec;
     studs y 0/15.5/31.5/47.5, z 97.125 .. zu; DTP z 95.625..97.125, y 0..68.5.
     Grey = already built; colour = new Stage 7 work. -->
<svg viewBox="0 0 840 470" width="210mm" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#555"/>
    </marker>
    <marker id="dimAs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#555"/>
    </marker>
    <marker id="attA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#1a6fb0"/>
    </marker>
    <marker id="grvA" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8" fill="#222"/>
    </marker>
    <style>
      text { fill:#222; }
      .halo { paint-order: stroke; stroke:#ffffff; stroke-width:4; stroke-linejoin:round; }
      .lbl { font-size:13px; }
      .lblb { font-size:13px; font-weight:bold; }
      .small { font-size:12px; }
    </style>
  </defs>

  <!-- view badge -->
  <rect x="12" y="10" width="318" height="58" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="24" y="30" class="lblb">ELEVATION · left rake wall</text>
  <text x="24" y="47" class="lbl">viewed from inside the shed</text>
  <text x="24" y="62" class="small">frame anchor: gravity ↓ (front end at left)</text>

  <!-- deck line + datum -->
  <rect x="40" y="418" width="770" height="9" fill="#c9b98f" stroke="#8a744a" stroke-width="1.2"/>
  <line x1="40" y1="418" x2="810" y2="418" stroke="#5c4d2c" stroke-width="2"/>
  <text x="300" y="443" class="lbl halo">deck top — the guide's height datum</text>
  <!-- gravity arrow -->
  <line x1="795" y1="434" x2="795" y2="460" stroke="#222" stroke-width="2" marker-end="url(#grvA)"/>
  <text x="778" y="468" class="small">DOWN</text>

  <!-- already-built wall (grey) -->
  <g fill="#e9e9e9" stroke="#8c8c8c" stroke-width="1.2">
    <!-- front wall band -->
    <rect x="86.4" y="61.3" width="33.6" height="356.7"/>
    <!-- bottom plate -->
    <rect x="120" y="413.65" width="624" height="4.35"/>
    <!-- wall studs -->
    <rect x="120" y="145" width="14.4" height="268.65"/>
    <rect x="268.8" y="145" width="14.4" height="268.65"/>
    <rect x="422.4" y="145" width="14.4" height="268.65"/>
    <rect x="576" y="145" width="14.4" height="268.65"/>
    <rect x="729.6" y="145" width="14.4" height="268.65"/>
    <!-- top plate -->
    <rect x="120" y="140.7" width="624" height="4.35"/>
    <!-- double top plate, runs 3½" over the back wall -->
    <rect x="120" y="136.34" width="657.6" height="4.36"/>
  </g>
  <text x="90" y="240" class="small halo" transform="rotate(-90 90 240)">front wall (tall)</text>
  <text x="756" y="154" class="small halo" text-anchor="end">double top plate, top 97⅛″ above deck</text>

  <!-- bearing line (dashed, extends over the plate top edge) -->
  <line x1="100" y1="63.4" x2="790" y2="141.6" stroke="#c0392b" stroke-width="1.6"
        stroke-dasharray="9,6"/>

  <!-- NEW WORK: rake plate -->
  <polygon points="120,65.65 744,136.34 703,136.34 120,70.3"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <!-- NEW WORK: stepped studs (tops mitred to the plate underside) -->
  <polygon points="120,136.34 134.4,136.34 134.4,71.93 120,70.3"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="268.8,136.34 283.2,136.34 283.2,88.78 268.8,87.16"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="422.4,136.34 436.8,136.34 436.8,106.18 422.4,104.55"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="576,136.34 590.4,136.34 590.4,123.58 576,121.95"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>

  <!-- stud length labels -->
  <text x="127" y="112" class="lblb halo" transform="rotate(-90 127 112)">22¾″</text>
  <text x="276" y="118" class="lblb halo" transform="rotate(-90 276 118)">17″</text>
  <text x="429" y="126" class="lblb halo" transform="rotate(-90 429 126)">11″</text>
  <text x="600" y="112" class="lblb halo">5″</text>
  <line x1="598" y1="116" x2="587" y2="126" stroke="#555" stroke-width="1"/>

  <!-- rake plate label + leader -->
  <text x="560" y="40" class="lblb halo">rake plate · 2×4 · 5' 9⅜″</text>
  <text x="560" y="56" class="lbl halo">its top edge is the bearing line</text>
  <line x1="600" y1="62" x2="562" y2="114" stroke="#555" stroke-width="1"/>

  <!-- height dimensions -->
  <line x1="66" y1="418" x2="66" y2="65.65" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="58" y1="65.65" x2="74" y2="65.65" stroke="#555" stroke-width="1"/>
  <text x="60" y="300" class="lbl halo" transform="rotate(-90 60 300)">121½″ above deck, at the front end</text>
  <line x1="794" y1="418" x2="794" y2="136.34" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="786" y1="136.34" x2="802" y2="136.34" stroke="#555" stroke-width="1"/>
  <text x="812" y="320" class="lbl halo" transform="rotate(-90 812 320)">97⅛″ above deck, at the back end</text>

  <!-- stud layout dimension -->
  <line x1="120" y1="156" x2="576" y2="156" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="120" y1="150" x2="120" y2="162" stroke="#555" stroke-width="1"/>
  <line x1="268.8" y1="150" x2="268.8" y2="162" stroke="#555" stroke-width="1"/>
  <line x1="422.4" y1="150" x2="422.4" y2="162" stroke="#555" stroke-width="1"/>
  <line x1="576" y1="150" x2="576" y2="162" stroke="#555" stroke-width="1"/>
  <text x="348" y="174" class="lbl halo" text-anchor="middle">stud faces at 15½″ · 31½″ · 47½″ from the front end — same layout as the wall below</text>

  <!-- attachment arrows -->
  <line x1="660" y1="182" x2="660" y2="136" stroke="#1a6fb0" stroke-width="1.8"
        marker-end="url(#attA)"/>
  <text x="520" y="200" class="lbl halo" fill="#1a6fb0">fasten the plate through the double</text>
  <text x="520" y="216" class="lbl halo" fill="#1a6fb0">top plate and into each stud top</text>
  <line x1="240" y1="248" x2="272" y2="144" stroke="#1a6fb0" stroke-width="1.8"
        marker-end="url(#attA)"/>
  <text x="150" y="266" class="lbl halo" fill="#1a6fb0">toe-fasten each stud</text>
  <text x="150" y="282" class="lbl halo" fill="#1a6fb0">at the bottom</text>

  <!-- orientation note -->
  <text x="120" y="468" class="small halo">◀ front (street side)</text>
  <text x="430" y="468" class="small halo">back ▶ — right wall: identical rake zone (door below)</text>
</svg>
