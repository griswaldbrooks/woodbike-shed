<?xml version="1.0" encoding="UTF-8"?>
<!-- model trace: elevation of left rake wall, interior view; horizontal = y 0 (front wall
     inner face, left) .. 80.5 (back wall outer face, right); vertical = z above deck.
     Mapping X(y)=120+8.4*y, Y(z)=418-2.9*z. Rake plate top edge = bearing line 121.5 .. 92.625;
     underside zu = zbot - 1.5*sec; plate bottom = max(zu, 92.625), flat seat over the back
     bearing from y 72.73; plate y 0..77 (82.236 long). Flat DTP z 95.625..97.125 y 0..60.73;
     flat top plate z 94.125..95.625 y 0..64.73. Stepped studs y 0/15.5/31.5/47.5, z 97.125..zu
     (22.773/16.96/10.96/4.96); header-cap mitres y 65.5/68.5 z 89..zu (6.335/5.21); back-corner
     studs y 73.5/75.5 z 1.5..92.625 (91.125, flat top). Grey = already built (door framing
     included: jacks 5..6.5/70.5..72 z 1.5..84, header 5..72 z 84..89, cripples 22.5/38.5/54.5
     z 89..94.125, corner block y 77..80.5 z 91.125..92.625); colour = new Stage 7 work. -->
<svg viewBox="0 0 840 470" width="210mm" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#555"/>
    </marker>
    <marker id="dimAs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#555"/>
    </marker>
    <marker id="attA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#1a6fb0"/>
    </marker>
    <marker id="grvA" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8" fill="#222"/>
    </marker>
    <style>
      text { fill:#222; }
      .halo { paint-order: stroke; stroke:#ffffff; stroke-width:4; stroke-linejoin:round; }
      .lbl { font-size:13px; }
      .lblb { font-size:13px; font-weight:bold; }
      .small { font-size:12px; }
    </style>
  </defs>

  <!-- view badge -->
  <rect x="12" y="10" width="318" height="58" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="24" y="30" class="lblb">ELEVATION · left rake wall</text>
  <text x="24" y="47" class="lbl">viewed from inside the shed</text>
  <text x="24" y="62" class="small">frame anchor: gravity ↓ (front end at left)</text>

  <!-- deck line + datum -->
  <rect x="40" y="418" width="770" height="9" fill="#c9b98f" stroke="#8a744a" stroke-width="1.2"/>
  <line x1="40" y1="418" x2="810" y2="418" stroke="#5c4d2c" stroke-width="2"/>
  <text x="300" y="443" class="lbl halo">deck top — the guide's height datum</text>
  <!-- gravity arrow -->
  <line x1="795" y1="434" x2="795" y2="460" stroke="#222" stroke-width="2" marker-end="url(#grvA)"/>
  <text x="778" y="468" class="small">DOWN</text>

  <!-- already-built wall (grey) -->
  <g fill="#e9e9e9" stroke="#8c8c8c" stroke-width="1.2">
    <!-- front wall band -->
    <rect x="90.6" y="61.3" width="29.4" height="356.7"/>
    <!-- bottom plates: short + long, split at the door opening -->
    <rect x="120" y="413.65" width="54.6" height="4.35"/>
    <rect x="712.2" y="413.65" width="54.6" height="4.35"/>
    <!-- west end stud -->
    <rect x="120" y="143.05" width="12.6" height="270.6"/>
    <!-- door jacks -->
    <rect x="162" y="174.4" width="12.6" height="239.25"/>
    <rect x="712.2" y="174.4" width="12.6" height="239.25"/>
    <!-- door header: two plies + cap, top 89 -->
    <rect x="162" y="159.9" width="562.8" height="14.5"/>
    <!-- cripples under the flat top plate -->
    <rect x="309" y="143.05" width="12.6" height="16.85"/>
    <rect x="443.4" y="143.05" width="12.6" height="16.85"/>
    <rect x="577.8" y="143.05" width="12.6" height="16.85"/>
    <!-- flat top plate, ends 64¾" from the front corner -->
    <rect x="120" y="138.7" width="543.7" height="4.35"/>
    <!-- flat double top plate, ends 60¾" from the front corner -->
    <rect x="120" y="134.34" width="510.1" height="4.36"/>
    <!-- back corner post + DTP corner block -->
    <rect x="766.8" y="158.09" width="29.4" height="255.56"/>
    <rect x="766.8" y="149.4" width="29.4" height="4.34"/>
  </g>
  <text x="94" y="240" class="small halo" transform="rotate(-90 94 240)">front wall (tall)</text>
  <text x="200" y="196" class="small halo">door header · cap top 89″ above deck</text>
  <text x="200" y="212" class="small halo">(door opening below — left wall: MAIN entry)</text>
  <text x="500" y="262" class="small halo">side DTP corner block,</text>
  <text x="500" y="278" class="small halo">top 92⅝″ — the plate seats</text>
  <text x="500" y="294" class="small halo">flat on it at the back</text>

  <!-- bearing line (dashed, extends to the back wall outer face) -->
  <line x1="120" y1="65.65" x2="796.2" y2="153.2" stroke="#c0392b" stroke-width="1.6"
        stroke-dasharray="9,6"/>

  <!-- NEW WORK: rake plate -->
  <polygon points="120,65.65 766.8,149.4 730.9,149.4 120,70.3"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <!-- NEW WORK: stepped studs (tops mitred to the plate underside) -->
  <polygon points="120,134.34 132.6,134.34 132.6,71.93 120,70.3"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="250.2,134.34 262.8,134.34 262.8,88.78 250.2,87.15"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="384.6,134.34 397.2,134.34 397.2,106.18 384.6,104.55"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="519,134.34 531.6,134.34 531.6,123.58 519,121.95"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <!-- NEW WORK: mitred cripples on the header cap -->
  <polygon points="670.2,159.9 682.8,159.9 682.8,143.16 670.2,141.53"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="695.4,159.9 708,159.9 708,146.42 695.4,144.79"
           fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <!-- NEW WORK: back-corner studs, flat tops on the plate's flat seat -->
  <rect x="737.4" y="149.4" width="12.6" height="264.25" fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <rect x="754.2" y="149.4" width="12.6" height="264.25" fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>

  <!-- stud length labels -->
  <text x="127" y="112" class="lblb halo" transform="rotate(-90 127 112)">22¾″</text>
  <text x="257" y="118" class="lblb halo" transform="rotate(-90 257 118)">16 31/32″</text>
  <text x="391" y="124" class="lblb halo" transform="rotate(-90 391 124)">10 31/32″</text>
  <text x="540" y="112" class="lblb halo">4 31/32″</text>
  <line x1="538" y1="116" x2="528" y2="125" stroke="#555" stroke-width="1"/>
  <text x="636" y="128" class="lblb halo">6⅜″ · 5¼″</text>
  <line x1="660" y1="130" x2="676" y2="142" stroke="#555" stroke-width="1"/>
  <text x="580" y="380" class="lblb halo">7' 7⅛″ ×2 — bottom plate</text>
  <line x1="680" y1="372" x2="743" y2="300" stroke="#555" stroke-width="1"/>

  <!-- rake plate label + leader -->
  <text x="440" y="34" class="lblb halo">rake plate · 2×4 · 6' 10¼″</text>
  <text x="440" y="50" class="lbl halo">its top edge is the bearing line</text>
  <line x1="470" y1="56" x2="500" y2="112" stroke="#555" stroke-width="1"/>

  <!-- height dimensions -->
  <line x1="66" y1="418" x2="66" y2="65.65" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="58" y1="65.65" x2="74" y2="65.65" stroke="#555" stroke-width="1"/>
  <text x="60" y="300" class="lbl halo" transform="rotate(-90 60 300)">121½″ above deck, at the front end</text>
  <line x1="808" y1="418" x2="808" y2="149.4" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="800" y1="149.4" x2="816" y2="149.4" stroke="#555" stroke-width="1"/>
  <text x="826" y="330" class="lbl halo" transform="rotate(-90 826 330)">92⅝″ above deck, at the back corner</text>

  <!-- stud layout dimension -->
  <line x1="120" y1="152" x2="754.2" y2="152" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <g stroke="#555" stroke-width="1">
    <line x1="120" y1="147" x2="120" y2="157"/>
    <line x1="250.2" y1="147" x2="250.2" y2="157"/>
    <line x1="384.6" y1="147" x2="384.6" y2="157"/>
    <line x1="519" y1="147" x2="519" y2="157"/>
    <line x1="670.2" y1="147" x2="670.2" y2="157"/>
    <line x1="695.4" y1="147" x2="695.4" y2="157"/>
    <line x1="737.4" y1="147" x2="737.4" y2="157"/>
    <line x1="754.2" y1="147" x2="754.2" y2="157"/>
  </g>
  <text x="437" y="172" class="small halo" text-anchor="middle">tape readings from the front corner — stepped: 0 · 15½ · 31½ · 47½ · header-cap mitres: 65½ · 68½ · back-corner studs: 73½ · 75½</text>

  <!-- attachment arrows -->
  <line x1="330" y1="250" x2="330" y2="142" stroke="#1a6fb0" stroke-width="1.8"
        marker-end="url(#attA)"/>
  <text x="180" y="270" class="lbl halo" fill="#1a6fb0">fasten the plate through the flat plates</text>
  <text x="180" y="286" class="lbl halo" fill="#1a6fb0">and into every stud top</text>
  <line x1="228" y1="316" x2="256" y2="140" stroke="#1a6fb0" stroke-width="1.8"
        marker-end="url(#attA)"/>
  <text x="150" y="334" class="lbl halo" fill="#1a6fb0">toe-fasten each stud</text>
  <text x="150" y="350" class="lbl halo" fill="#1a6fb0">at the bottom</text>
  <line x1="620" y1="255" x2="770" y2="155" stroke="#555" stroke-width="1"/>
  <line x1="600" y1="200" x2="628" y2="140" stroke="#555" stroke-width="1"/>
  <line x1="620" y1="222" x2="660" y2="145" stroke="#555" stroke-width="1"/>
  <text x="520" y="210" class="small halo">flat double top plate · ends 60¾″</text>
  <text x="520" y="230" class="small halo">from the front corner; flat top plate ends 64¾″</text>

  <!-- orientation note -->
  <text x="120" y="468" class="small halo">◀ front (street side)</text>
  <text x="330" y="468" class="small halo">back ▶ — right wall: identical rake zone over an identical door (brewery service)</text>
</svg>
