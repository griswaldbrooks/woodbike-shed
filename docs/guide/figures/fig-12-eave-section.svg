<?xml version="1.0" encoding="UTF-8"?>
<!-- model trace: section C-C in the Y-Z plane through the front overhang; horizontal = y
     (fascia y -17..-15.5, rafter tail plumb at y -15.5, front wall y -3.5..0), vertical =
     z above deck. Mapping X(y)=627+13*y, Y(z)=436-2.85*z. Fascia z 127.6865..133.1865
     flush with rafter tail top 133.1865; rafter bottom edge 127.3125 at the tail; front
     seat z 123 over y -4..0, kick 1.5 at y 0; front wall plate top z 123. Rafter broken
     off just past the wall face. -->
<svg viewBox="0 0 840 490" width="210mm" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="dimA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#555"/>
    </marker>
    <marker id="dimAs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#555"/>
    </marker>
    <marker id="attA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#1a6fb0"/>
    </marker>
    <marker id="grvA" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8" fill="#222"/>
    </marker>
    <pattern id="h12b" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M0,7 L7,0" stroke="#8a6d3b" stroke-width="0.9"/>
    </pattern>
    <style>
      text { fill:#222; }
      .lbl { font-size:13px; }
      .lblb { font-size:13px; font-weight:bold; }
      .small { font-size:12px; }
    </style>
  </defs>

  <!-- view badge -->
  <rect x="470" y="10" width="358" height="62" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="482" y="30" class="lblb">SECTION C–C · front eave</text>
  <text x="482" y="47" class="lbl">viewed from the left gable end</text>
  <text x="482" y="64" class="small">frame anchor: gravity ↓ · cut plane shown in Fig 12.2</text>

  <!-- deck line + datum + gravity -->
  <rect x="40" y="436" width="760" height="9" fill="#c9b98f" stroke="#8a744a" stroke-width="1.2"/>
  <line x1="40" y1="436" x2="800" y2="436" stroke="#5c4d2c" stroke-width="2"/>
  <text x="330" y="460"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">deck top — the guide's height datum</text>
  <text x="330" y="460"  class="lbl">deck top — the guide's height datum</text>
  <line x1="795" y1="452" x2="795" y2="478" stroke="#222" stroke-width="2" marker-end="url(#grvA)"/>
  <text x="742" y="472" class="small">DOWN</text>
  <text x="250" y="487"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">front (street side) at left — the roof runs back to the right</text>
  <text x="250" y="487"  class="small">front (street side) at left — the roof runs back to the right</text>

  <!-- already-built front wall (grey) -->
  <rect x="581.5" y="85.45" width="45.5" height="350.55" fill="#e9e9e9" stroke="#8c8c8c" stroke-width="1.2"/>
  <rect x="581.5" y="85.45" width="45.5" height="4.28" fill="#dcdcdc" stroke="#8c8c8c" stroke-width="1.2"/>
  <text x="604" y="330"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" transform="rotate(-90 604 330)">front wall — plate top 123″ above deck</text>
  <text x="604" y="330"  class="small" transform="rotate(-90 604 330)">front wall — plate top 123″ above deck</text>

  <!-- the rafter, cut by the section plane (hatched), broken past the wall -->
  <polygon points="425.5,73.16 575,85.45 627,85.45 627,89.73 679,94
                   672,90 679,86 672,82 679,77.26 425.5,56.42"
           fill="#e8d3a8" stroke="#6b4f16" stroke-width="2"/>
  <polygon points="425.5,73.16 575,85.45 627,85.45 627,89.73 679,94
                   672,90 679,86 672,82 679,77.26 425.5,56.42"
           fill="url(#h12b)" stroke="none"/>

  <!-- NEW WORK: fascia -->
  <rect x="406" y="56.42" width="19.5" height="15.67" fill="#d9a441" stroke="#6b4f16" stroke-width="2"/>
  <rect x="406" y="56.42" width="19.5" height="15.67" fill="url(#h12b)" stroke="none"/>

  <!-- seat highlight on the plate top -->
  <line x1="581.5" y1="85.45" x2="627" y2="85.45" stroke="#c0392b" stroke-width="3"/>
  <line x1="575" y1="85.45" x2="581.5" y2="85.45" stroke="#c0392b" stroke-width="3" stroke-dasharray="3,3"/>

  <!-- flush-top takeaway + height of the fascia / tail tops above the deck -->
  <line x1="72" y1="56.42" x2="404" y2="56.42" stroke="#555" stroke-width="1"/>
  <text x="400" y="48"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="end" font-weight="bold">tail tops flush with the fascia top</text>
  <text x="400" y="48"  class="small" text-anchor="end" font-weight="bold">tail tops flush with the fascia top</text>
  <line x1="80" y1="436" x2="80" y2="56.42" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <text x="70" y="250"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle" transform="rotate(-90 70 250)">133-3/16″ above deck</text>
  <text x="70" y="250"  class="lbl" text-anchor="middle" transform="rotate(-90 70 250)">133-3/16″ above deck</text>

  <!-- overhang dimension -->
  <line x1="425.5" y1="108" x2="581.5" y2="108" stroke="#555" stroke-width="1"
        marker-start="url(#dimAs)" marker-end="url(#dimA)"/>
  <line x1="425.5" y1="77" x2="425.5" y2="114" stroke="#555" stroke-width="1"/>
  <line x1="581.5" y1="90" x2="581.5" y2="114" stroke="#555" stroke-width="1"/>
  <text x="503.5" y="102"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">12″ front overhang</text>
  <text x="503.5" y="102"  class="lbl" text-anchor="middle">12″ front overhang</text>
  <text x="503.5" y="126"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="middle">wall face to rafter tails</text>
  <text x="503.5" y="126"  class="small" text-anchor="middle">wall face to rafter tails</text>

  <!-- labels -->
  <text x="130" y="150"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">front fascia · 2×6 · 18' 0″</text>
  <text x="130" y="150"  class="lblb">front fascia · 2×6 · 18' 0″</text>
  <text x="130" y="168"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">vertical, tight against the plumb rafter tails</text>
  <text x="130" y="168"  class="lbl">vertical, tight against the plumb rafter tails</text>
  <text x="130" y="184"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">fascia face stands 1½″ past the tails</text>
  <text x="130" y="184"  class="small">fascia face stands 1½″ past the tails</text>
  <line x1="330" y1="140" x2="414" y2="74" stroke="#555" stroke-width="1"/>
  <text x="440" y="166"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">rafter · 2×6</text>
  <text x="440" y="166"  class="lbl">rafter · 2×6</text>
  <text x="440" y="182"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">hatched — cut by the</text>
  <text x="440" y="182"  class="small">hatched — cut by the</text>
  <text x="440" y="196"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">section plane</text>
  <text x="440" y="196"  class="small">section plane</text>
  <line x1="437" y1="154" x2="437" y2="77" stroke="#555" stroke-width="1"/>
  <text x="648" y="110"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">front birdsmouth —</text>
  <text x="648" y="110"  class="lbl">front birdsmouth —</text>
  <text x="648" y="128"  class="small" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">plate-top seat — Fig 11.2</text>
  <text x="648" y="128"  class="small">plate-top seat — Fig 11.2</text>
  <line x1="644" y1="112" x2="612" y2="88" stroke="#555" stroke-width="1"/>

  <!-- attachment -->
  <text x="130" y="92"  class="lblb" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">fasten the fascia to every</text>
  <text x="130" y="92"  class="lblb" fill="#1a6fb0">fasten the fascia to every</text>
  <text x="130" y="108"  class="lbl" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">rafter tail it covers</text>
  <text x="130" y="108"  class="lbl" fill="#1a6fb0">rafter tail it covers</text>
  <line x1="300" y1="86" x2="404" y2="66" stroke="#1a6fb0" stroke-width="1.8" marker-end="url(#attA)"/>
</svg>
