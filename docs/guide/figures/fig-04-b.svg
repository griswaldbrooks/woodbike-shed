<svg viewBox="0 0 780 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 4.2 — one gravel pocket, section cut across the front skid at a pedestal.
       model trace: skid z -9.75..-6.25 (3½"), rim/joists z -6.25..-0.75 (5½"), OSB -0.75..0;
       pocket ≥24" sq, 8–12" typical depth to firm subsoil. Pedestal: StrataRise 3560ML-DF per
       stratarise.us "Multi-Level - for Joists": adjustment 35–60 mm (1⅜"–2⅜"), base plate Ø 200 mm (8"),
       head for joists ≤ 3" wide, fixing flange with screw slot, rated 1760 lb at weakest setting.
       Pedestal and paver heights schematic (not modeled); pedestal zone drawn 3× vertical for legibility.
       Scale 4 px/in. -->
  <rect width="780" height="600" fill="#ffffff"/>
  <defs>
    <marker id="dim04b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#444"/></marker>
    <marker id="dim04bs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#444"/></marker>
    <marker id="drop04b" markerWidth="10" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
    <pattern id="soil04b" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e8e0cd"/>
      <path d="M0,10 L10,0" stroke="#b8a880" stroke-width="1"/>
    </pattern>
    <pattern id="firm04b" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d9cba8"/>
      <path d="M0,8 L8,0" stroke="#a08c5c" stroke-width="1.3"/>
      <path d="M-2,2 L2,-2" stroke="#a08c5c" stroke-width="1.3"/>
    </pattern>
    <pattern id="gravel04b" width="14" height="12" patternUnits="userSpaceOnUse">
      <rect width="14" height="12" fill="#f4f2ea"/>
      <circle cx="3" cy="3" r="1.8" fill="#a8a294"/>
      <circle cx="10" cy="8" r="2.2" fill="#b5af9f"/>
      <circle cx="6" cy="10" r="1.4" fill="#9c9688"/>
    </pattern>
    <pattern id="skid04b" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#9caf88"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#5d7050" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- view badge -->
  <g>
    <rect x="16" y="14" width="356" height="106" fill="#faf8f2" stroke="#2b2b2b" stroke-width="2" rx="6"/>
    <text x="30" y="40" font-size="19" font-weight="bold" fill="#2b2b2b">SECTION B–B</text>
    <text x="30" y="64" font-size="14" fill="#2b2b2b">cut across the front skid at a pedestal (Fig 4.1)</text>
    <text x="30" y="84" font-size="14" fill="#2b2b2b">viewed toward the RIGHT end</text>
    <text x="30" y="106" font-size="14" fill="#2b2b2b">gravity ↓ DOWN</text>
  </g>
  <g font-size="13.5" fill="#555">
    <text x="396" y="40">load path: joist → rim → skid → pedestal</text>
    <text x="396" y="60">→ paver → gravel → firm soil</text>
  </g>

  <!-- gravity arrow -->
  <line x1="712" y1="150" x2="712" y2="248" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M712,262 L703,244 L721,244 Z" fill="#2b2b2b"/>
  <text x="712" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">DOWN</text>

  <!-- soil: soft band + firm subsoil, hatched = cut material -->
  <rect x="60" y="330" width="660" height="40" fill="url(#soil04b)"/>
  <rect x="60" y="370" width="660" height="90" fill="url(#firm04b)"/>
  <line x1="60" y1="370" x2="720" y2="370" stroke="#8f7f5e" stroke-width="2"/>
  <text x="150" y="355" font-size="13" font-style="italic" fill="#8a7c63">soft soil</text>
  <text x="150" y="420" font-size="13" font-style="italic" fill="#7a6a4c">firm subsoil</text>

  <!-- grade line -->
  <line x1="60" y1="330" x2="720" y2="330" stroke="#5d7c3f" stroke-width="2.6"/>
  <text x="66" y="322" font-size="14" font-weight="bold" fill="#5d7c3f">grade</text>

  <!-- pocket: gravel fill + fabric -->
  <rect x="342" y="330" width="96" height="40" fill="url(#gravel04b)" stroke="#8a8578" stroke-width="2"/>
  <path d="M342,318 L342,370 L438,370 L438,318" fill="none" stroke="#b06a2c" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="452" y="346" font-size="13" fill="#b06a2c">fabric lapped up the sides</text>
  <text x="452" y="368" font-size="13" fill="#444">¾ in angular crushed stone —</text>
  <text x="452" y="386" font-size="13" fill="#444">3 in lifts, tamp each one</text>

  <!-- paver base pad -->
  <rect x="356" y="318" width="68" height="12" fill="#c9c9c1" stroke="#77776c" stroke-width="1.8"/>

  <!-- pedestal (StrataRise 3560ML-DF): base plate, threaded column, ring, head, fixing flange.
       Zone drawn 3× vertical; real adjustment 1⅜–2⅜ in. -->
  <g>
    <!-- base plate Ø 8 in -->
    <rect x="374" y="314" width="32" height="4" fill="#5a5a5a" stroke="#2b2b2b" stroke-width="1.6"/>
    <!-- threaded column -->
    <rect x="386" y="300" width="8" height="14" fill="#6a6a6a" stroke="#2b2b2b" stroke-width="1.6"/>
    <line x1="386.5" y1="302" x2="393.5" y2="302" stroke="#2b2b2b" stroke-width="0.9"/>
    <line x1="386.5" y1="312" x2="393.5" y2="312" stroke="#2b2b2b" stroke-width="0.9"/>
    <!-- adjustment ring -->
    <rect x="380" y="303" width="20" height="8" rx="2.5" fill="#9a9a9a" stroke="#2b2b2b" stroke-width="1.6"/>
    <!-- head, seats the skid -->
    <rect x="384" y="294" width="12" height="6" fill="#5a5a5a" stroke="#2b2b2b" stroke-width="1.6"/>
    <!-- fixing flange with screw slot, under the skid bottom edge -->
    <rect x="396" y="294" width="17" height="3.5" fill="#5a5a5a" stroke="#2b2b2b" stroke-width="1.4"/>
    <line x1="403" y1="295.8" x2="408.5" y2="295.8" stroke="#e8e8e8" stroke-width="1.2"/>
    <!-- flange screw up into the skid -->
    <line x1="406" y1="300.5" x2="406" y2="287" stroke="#2b2b2b" stroke-width="1.8"/>
    <line x1="402.5" y1="300.5" x2="409.5" y2="300.5" stroke="#2b2b2b" stroke-width="2"/>
  </g>

  <!-- skid end section: 3½ in square, centered on the 3 in head (¼ in overhang each side) -->
  <rect x="383" y="280" width="14" height="14" fill="url(#skid04b)" stroke="#2f4020" stroke-width="2"/>

  <!-- string line at skid tops -->
  <line x1="80" y1="280" x2="700" y2="280" stroke="#c0392b" stroke-width="2"/>
  <rect x="396" y="254" width="308" height="20" fill="#ffffff" fill-opacity="0.85"/>
  <text x="400" y="269" font-size="14" font-weight="bold" fill="#c0392b">string line — both skid tops to this ONE plane</text>

  <!-- future work above the skid: dashed -->
  <g fill="none" stroke="#666" stroke-width="2" stroke-dasharray="7,4">
    <rect x="383" y="258" width="14" height="22"/>
    <line x1="372" y1="255" x2="440" y2="255"/>
  </g>
  <text x="400" y="212" font-size="13" fill="#666">later: 2×6 rim + floor joists,</text>
  <text x="400" y="228" font-size="13" fill="#666">then the deck (dashed = Stage 2)</text>

  <!-- drop arrows -->
  <line x1="346" y1="254" x2="346" y2="276" stroke="#c0392b" stroke-width="2.2" marker-end="url(#drop04b)"/>
  <text x="336" y="250" text-anchor="end" font-size="13" fill="#c0392b">skid drops onto the pedestal head</text>
  <line x1="346" y1="296" x2="346" y2="312" stroke="#c0392b" stroke-width="2.2" marker-end="url(#drop04b)"/>
  <text x="336" y="292" text-anchor="end" font-size="13" fill="#c0392b">pedestal drops onto the paver</text>

  <!-- right-side labels -->
  <g font-size="13" fill="#444">
    <path d="M448,282 L414,295" stroke="#777" stroke-width="1.2" fill="none"/>
    <text x="452" y="286">fixing flange — screw into the skid</text>
    <path d="M448,302 L401,307" stroke="#777" stroke-width="1.2" fill="none"/>
    <text x="452" y="306">adjustment ring — turn to raise/lower</text>
    <path d="M448,320 L407,316" stroke="#777" stroke-width="1.2" fill="none"/>
    <text x="452" y="324">base plate Ø 8 in, flat on the paver</text>
  </g>
  <path d="M340,236 L383,284" stroke="#777" stroke-width="1.2" fill="none"/>
  <text x="336" y="232" text-anchor="end" font-size="13" fill="#444">skid · 4×4 PT · 16 ft — 3½ in wide on the 3 in head</text>


  <!-- pocket-top note -->
  <g font-size="13">
    <text x="60" y="310" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">keep pocket top at or above finished grade</text>
    <text x="60" y="310" fill="#444">keep pocket top at or above finished grade</text>
  </g>

  <!-- depth dimension -->
  <line x1="316" y1="330" x2="316" y2="370" stroke="#444" stroke-width="1.4" marker-start="url(#dim04bs)" marker-end="url(#dim04b)"/>
  <line x1="316" y1="330" x2="338" y2="330" stroke="#999" stroke-width="1"/>
  <line x1="316" y1="370" x2="338" y2="370" stroke="#999" stroke-width="1"/>
  <g font-size="13">
    <text x="60" y="392" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">8–12 in typical — dig to FIRM soil</text>
    <text x="60" y="392" fill="#444">8–12 in typical — dig to FIRM soil</text>
  </g>

  <!-- pocket width dimension -->
  <line x1="342" y1="388" x2="438" y2="388" stroke="#444" stroke-width="1.4" marker-start="url(#dim04bs)" marker-end="url(#dim04b)"/>
  <line x1="342" y1="372" x2="342" y2="392" stroke="#999" stroke-width="1"/>
  <line x1="438" y1="372" x2="438" y2="392" stroke="#999" stroke-width="1"/>
  <rect x="238" y="396" width="304" height="18" fill="#ffffff" fill-opacity="0.85"/>
  <text x="390" y="410" text-anchor="middle" font-size="13" fill="#444">24 in minimum — wider is better on soft ground</text>

  <text x="520" y="440" font-size="13.5" font-weight="bold" fill="#7a6a4c">probe here first to find firm soil</text>

  <!-- bottom notes -->
  <rect x="60" y="490" width="660" height="88" fill="#fdf6ec" stroke="#e0cba8" stroke-width="1.5" rx="6"/>
  <text x="76" y="514" font-size="14" fill="#7a5c2e">Dig each pocket to firm soil, not to a fixed depth — the depth varies across the footprint.</text>
  <text x="76" y="538" font-size="14" fill="#7a5c2e">No shims: the pedestal's ring is the shim — turn it until the skid top meets the string.</text>
  <text x="76" y="562" font-size="14" fill="#7a5c2e">Pedestal zone drawn 3× vertical; the real pedestal adjusts 1⅜–2⅜ in at every point.</text>
</svg>
