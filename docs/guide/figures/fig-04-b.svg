<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Fig 4.2 — the gravel pad in section, cut across the front skid (line B–B in Fig 4.1).
       model trace: skid z -9.75..-6.25 (3½"), rim/joists z -6.25..-0.75 (5½"), OSB -0.75..0 (¾");
       deck top 9¾" above the skid bottoms = 9¾" above the pad top with the skids direct on gravel.
       Pad: the whole footprint excavated to firm subsoil (8–12" typical), fabric-lined, ¾" angular
       stone in 3" tamped lifts, screeded flat and level; pad top at or slightly above finished grade.
       Piers/pedestals/paver pads DROPPED 2026-08-24 per captain decision (firstmate
       data/shed-guide-depth-pass/captain-decision-2026-08-24.md).
       Scale 4 px/in, vertical TRUE — no exaggeration. The gravel band runs full width: the pad
       continues off both edges of this cut, across the whole footprint. -->
  <rect width="780" height="620" fill="#ffffff"/>
  <defs>
    <marker id="dim04b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#444"/></marker>
    <marker id="dim04bs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#444"/></marker>
    <marker id="drop04b" markerWidth="10" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
    <pattern id="firm04b" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d9cba8"/>
      <path d="M0,8 L8,0" stroke="#a08c5c" stroke-width="1.3"/>
      <path d="M-2,2 L2,-2" stroke="#a08c5c" stroke-width="1.3"/>
    </pattern>
    <pattern id="gravel04b" width="14" height="12" patternUnits="userSpaceOnUse">
      <rect width="14" height="12" fill="#f4f2ea"/>
      <circle cx="3" cy="3" r="1.8" fill="#a8a294"/>
      <circle cx="10" cy="8" r="2.2" fill="#b5af9f"/>
      <circle cx="6" cy="10" r="1.4" fill="#9c9688"/>
    </pattern>
    <pattern id="skid04b" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#9caf88"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#5d7050" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- view badge -->
  <g>
    <rect x="16" y="14" width="356" height="106" fill="#faf8f2" stroke="#2b2b2b" stroke-width="2" rx="6"/>
    <text x="30" y="40" font-size="19" font-weight="bold" fill="#2b2b2b">SECTION B–B</text>
    <text x="30" y="64" font-size="14" fill="#2b2b2b">cut across the pad and the front skid (Fig 4.1)</text>
    <text x="30" y="84" font-size="14" fill="#2b2b2b">viewed toward the RIGHT end</text>
    <text x="30" y="106" font-size="14" fill="#2b2b2b">gravity ↓ DOWN · depths true, not exaggerated</text>
  </g>
  <g font-size="13.5" fill="#555">
    <text x="396" y="40">load path: joist → rim → skid</text>
    <text x="396" y="60">→ tamped gravel → firm soil</text>
  </g>

  <!-- gravity arrow -->
  <line x1="712" y1="150" x2="712" y2="248" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M712,262 L703,244 L721,244 Z" fill="#2b2b2b"/>
  <text x="712" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">DOWN</text>

  <!-- firm subsoil, hatched = cut material -->
  <rect x="60" y="370" width="660" height="90" fill="url(#firm04b)"/>
  <text x="150" y="420" font-size="13" font-style="italic" fill="#7a6a4c">firm subsoil</text>

  <!-- tamped gravel, full width of the pad -->
  <rect x="60" y="330" width="660" height="40" fill="url(#gravel04b)" stroke="#8a8578" stroke-width="2"/>
  <g font-size="13">
    <text x="230" y="348" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">¾ in ANGULAR crushed stone —</text>
    <text x="230" y="364" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">3 in lifts, tamped, screeded LEVEL</text>
    <text x="230" y="348" fill="#444">¾ in ANGULAR crushed stone —</text>
    <text x="230" y="364" fill="#444">3 in lifts, tamped, screeded LEVEL</text>
  </g>

  <!-- fabric under the stone, lapped up the sides of the excavation (off this cut) -->
  <path d="M60,322 L60,372 L720,372 L720,322" fill="none" stroke="#b06a2c" stroke-width="2" stroke-dasharray="8,4"/>
  <path d="M448,384 L420,373" stroke="#777" stroke-width="1.2" fill="none"/>
  <text x="452" y="388" font-size="13" fill="#b06a2c">landscape fabric, lapped up the sides</text>

  <!-- pad top line -->
  <line x1="60" y1="330" x2="720" y2="330" stroke="#5d7c3f" stroke-width="2.6"/>
  <text x="66" y="308" font-size="14" font-weight="bold" fill="#5d7c3f">pad top — screeded FLAT AND LEVEL</text>

  <!-- the front skid, bedded directly on the screeded gravel -->
  <rect x="383" y="316" width="14" height="14" fill="url(#skid04b)" stroke="#2f4020" stroke-width="2"/>
  <path d="M340,260 L383,318" stroke="#777" stroke-width="1.2" fill="none"/>
  <text x="336" y="256" text-anchor="end" font-size="13" fill="#444">skid · 4×4 PT · 16 ft — beds on the gravel</text>

  <!-- string line at skid tops -->
  <line x1="80" y1="316" x2="700" y2="316" stroke="#c0392b" stroke-width="2"/>
  <rect x="396" y="292" width="308" height="20" fill="#ffffff" fill-opacity="0.85"/>
  <text x="400" y="307" font-size="14" font-weight="bold" fill="#c0392b">string line — both skid tops to this ONE plane</text>

  <!-- future work above the skid: dashed (rim + joist ends + deck) -->
  <g fill="none" stroke="#666" stroke-width="2" stroke-dasharray="7,4">
    <rect x="383" y="294" width="6" height="22"/>
    <rect x="446.5" y="294" width="6" height="22"/>
    <rect x="372" y="291" width="160" height="3"/>
  </g>
  <text x="470" y="266" font-size="13" fill="#666">later: 2×6 rim + floor joists,</text>
  <text x="470" y="282" font-size="13" fill="#666">then the deck (dashed = Stage 2)</text>

  <!-- drop arrow -->
  <line x1="346" y1="290" x2="346" y2="312" stroke="#c0392b" stroke-width="2.2" marker-end="url(#drop04b)"/>
  <text x="336" y="286" text-anchor="end" font-size="13" fill="#c0392b">skid beds DOWN directly on the screeded gravel</text>

  <!-- deck-top height above the pad top: span too short for internal arrows, so the two
       arrowheads point inward at the span from outside — still a true double-arrow dim -->
  <line x1="620" y1="306" x2="620" y2="315" stroke="#444" stroke-width="1.4" marker-end="url(#dim04b)"/>
  <line x1="620" y1="340" x2="620" y2="331" stroke="#444" stroke-width="1.4" marker-end="url(#dim04b)"/>
  <line x1="620" y1="316" x2="620" y2="330" stroke="#444" stroke-width="1.4"/>
  <line x1="590" y1="316" x2="626" y2="316" stroke="#999" stroke-width="1"/>
  <g font-size="13">
    <text x="632" y="346" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">deck top lands 9¾ in</text>
    <text x="632" y="362" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">above the pad top</text>
    <text x="632" y="346" fill="#444">deck top lands 9¾ in</text>
    <text x="632" y="362" fill="#444">above the pad top</text>
  </g>

  <!-- excavation depth dimension -->
  <line x1="200" y1="330" x2="200" y2="370" stroke="#444" stroke-width="1.4" marker-start="url(#dim04bs)" marker-end="url(#dim04b)"/>
  <line x1="200" y1="370" x2="296" y2="370" stroke="#999" stroke-width="1"/>
  <g font-size="13">
    <text x="60" y="392" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">8–12 in typical — dig to FIRM soil</text>
    <text x="60" y="392" fill="#444">8–12 in typical — dig to FIRM soil</text>
  </g>

  <text x="520" y="440" font-size="13.5" font-weight="bold" fill="#7a6a4c">probe here first to find firm soil</text>

  <!-- bottom notes -->
  <rect x="60" y="490" width="660" height="96" fill="#fdf6ec" stroke="#e0cba8" stroke-width="1.5" rx="6"/>
  <text x="76" y="514" font-size="14" fill="#7a5c2e">Dig the FULL footprint to firm soil — depth varies, typically 8–12 in, never a fixed depth.</text>
  <text x="76" y="538" font-size="14" fill="#7a5c2e">No shims anywhere — the screeded gravel is the level; wood shims rot in the ground.</text>
  <text x="76" y="562" font-size="14" fill="#7a5c2e">Depths drawn true, no exaggeration; the pad continues off both edges of this cut.</text>
</svg>
