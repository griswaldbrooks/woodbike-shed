<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" font-family="Helvetica, Arial, sans-serif">
  <!-- model trace: left wall elevation from outside; u = distance back from the front corner,
       X(u)=486.4-4.6*u (front end at right), Y(z)=695.5-4.6*z. Door clear u 6.5..70.5, head
       84; courses 1..12 (z 0..84) split into 10" piers (u 0..6.5 and 70.5..84); course 13
       z 84..91.5 full width; course 14 z 91.5..99 clipped at the rake (side-top line = rafter
       bottom edge + 1" tuck: z 123.8125 at the front, 92.3125 at the back); rake boards z
       bottoms 99/106.5/114/121.5, bottom-edge lengths 66.167/46.167/26.167/6.167, each 20"
       shorter than the one below. Right wall identical. -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2b2b2b"/></marker>
    <marker id="arrd" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4a4a4a" stroke-width="1" opacity="0.45"/></pattern>
    <pattern id="hatchgrey" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a8a8a" stroke-width="1" opacity="0.6"/></pattern>
  </defs>

  <rect width="760" height="800" fill="#ffffff"/>
  <rect x="10.0" y="10.0" width="400.0" height="83.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="24.0" y="39.0" font-size="16" text-anchor="start" font-weight="bold" fill="#2b2b2b">ELEVATION</text>
  <text x="24.0" y="59.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">left wall, viewed from outside the left wall (right wall identical)</text>
  <text x="24.0" y="79.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">&#9660; DOWN &#183; deck top at the bottom</text>

  <line x1="70.0" y1="695.5" x2="516.0" y2="695.5" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="52.0" y="748.0" font-size="13" text-anchor="start" font-weight="bold" fill="#2b2b2b">deck top</text>

  <!-- skirt (step 1) -->
  <rect x="100.0" y="693.2" width="386.4" height="33.3" fill="#e6e6e6" stroke="#808080" stroke-width="1.5"/>
  <text x="500.0" y="715.0" font-size="13" text-anchor="start" font-weight="normal" fill="#808080">skirt (step 1)</text>
  <line x1="498.0" y1="711.0" x2="470.0" y2="709.3" stroke="#808080" stroke-width="1" marker-end="url(#arrd)"/>

  <!-- wall backing: full band above the door head + the two door piers below -->
  <rect x="100.0" y="270.9" width="386.4" height="38.2" fill="#f0f0f0" stroke="#808080" stroke-width="1.5"/>
  <rect x="100.0" y="309.1" width="62.1" height="386.4" fill="#f0f0f0" stroke="#808080" stroke-width="1.5"/>
  <rect x="456.5" y="309.1" width="29.9" height="386.4" fill="#f0f0f0" stroke="#808080" stroke-width="1.5"/>

  <!-- door opening between the piers -->
  <rect x="162.1" y="309.1" width="294.4" height="386.4" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="309.3" y="480.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#808080">door opening &#183; 64&#8243; clear &#183; head 84&#8243;</text>
  <text x="309.3" y="498.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#808080">MAIN entry (left wall) &#183; casing Stage 11,</text>
  <text x="309.3" y="516.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#808080">door Stage 12</text>

  <!-- course lines in the piers (7" exposure) -->
  <g stroke="#808080" stroke-width="1">
    <line x1="100.0" y1="663.3" x2="162.1" y2="663.3"/><line x1="456.5" y1="663.3" x2="486.4" y2="663.3"/>
    <line x1="100.0" y1="631.1" x2="162.1" y2="631.1"/><line x1="456.5" y1="631.1" x2="486.4" y2="631.1"/>
    <line x1="100.0" y1="598.9" x2="162.1" y2="598.9"/><line x1="456.5" y1="598.9" x2="486.4" y2="598.9"/>
    <line x1="100.0" y1="566.7" x2="162.1" y2="566.7"/><line x1="456.5" y1="566.7" x2="486.4" y2="566.7"/>
    <line x1="100.0" y1="534.5" x2="162.1" y2="534.5"/><line x1="456.5" y1="534.5" x2="486.4" y2="534.5"/>
    <line x1="100.0" y1="502.3" x2="162.1" y2="502.3"/><line x1="456.5" y1="502.3" x2="486.4" y2="502.3"/>
    <line x1="100.0" y1="470.1" x2="162.1" y2="470.1"/><line x1="456.5" y1="470.1" x2="486.4" y2="470.1"/>
    <line x1="100.0" y1="437.9" x2="162.1" y2="437.9"/><line x1="456.5" y1="437.9" x2="486.4" y2="437.9"/>
    <line x1="100.0" y1="405.7" x2="162.1" y2="405.7"/><line x1="456.5" y1="405.7" x2="486.4" y2="405.7"/>
    <line x1="100.0" y1="373.5" x2="162.1" y2="373.5"/><line x1="456.5" y1="373.5" x2="486.4" y2="373.5"/>
    <line x1="100.0" y1="341.3" x2="162.1" y2="341.3"/><line x1="456.5" y1="341.3" x2="486.4" y2="341.3"/>
    <line x1="100.0" y1="309.1" x2="162.1" y2="309.1"/><line x1="456.5" y1="309.1" x2="486.4" y2="309.1"/>
    <line x1="100.0" y1="274.6" x2="486.4" y2="274.6"/>
  </g>

  <!-- course numbers -->
  <g font-size="13" text-anchor="end" font-weight="normal" fill="#808080">
    <text x="88.0" y="683.9">1</text>
    <text x="88.0" y="651.7">2</text>
    <text x="88.0" y="619.5">3</text>
    <text x="88.0" y="587.3">4</text>
    <text x="88.0" y="555.1">5</text>
    <text x="88.0" y="522.9">6</text>
    <text x="88.0" y="490.7">7</text>
    <text x="88.0" y="458.5">8</text>
    <text x="88.0" y="426.3">9</text>
    <text x="88.0" y="394.1">10</text>
    <text x="88.0" y="361.9">11</text>
    <text x="88.0" y="329.7">12</text>
    <text x="88.0" y="296.5">13</text>
    <text x="88.0" y="262.0">14</text>
  </g>
  <text x="62.0" y="500.5" font-size="13" text-anchor="start" font-weight="normal" fill="#555555" transform="rotate(-90,62.0,500.5)">courses 1&#8211;12 &#183; 10&#8243; piers around the door</text>

  <!-- course 14, clipped at the rake (siding colour) -->
  <polygon points="100,274.6 486.4,274.6 486.4,240.1 182.0,240.1 100,270.9" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>

  <!-- rake boards (siding colour) -->
  <polygon points="486.4,240.1 182.0,240.1 274.0,205.6 486.4,205.6" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <text x="500.0" y="225.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">rake board 1 &#183; 5&#8242; 6&#8537;&#8243;</text>
  <line x1="498.0" y1="221.0" x2="470.0" y2="222.9" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <polygon points="486.4,205.6 274.0,205.6 366.0,171.1 486.4,171.1" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <text x="500.0" y="188.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">rake board 2 &#183; 3&#8242; 10&#8537;&#8243;</text>
  <line x1="498.0" y1="184.0" x2="470.0" y2="188.4" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <polygon points="486.4,171.1 366.0,171.1 458.0,136.6 486.4,136.6" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <text x="500.0" y="153.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">rake board 3 &#183; 2&#8242; 2&#8537;&#8243;</text>
  <line x1="498.0" y1="149.0" x2="470.0" y2="153.9" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <polygon points="458.0,136.6 486.4,136.6 486.4,126.0" fill="#e8d3a8" stroke="#6b5216" stroke-width="2"/>
  <text x="500.0" y="128.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">rake board 4 &#183; 6&#8537;&#8243;</text>
  <line x1="498.0" y1="124.0" x2="478.0" y2="131.3" stroke="#555555" stroke-width="1" marker-end="url(#arrd)"/>
  <text x="500.0" y="268.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">tops ripped at the roof pitch</text>
  <text x="500.0" y="285.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">(&#8776;20&#189;&#176; off square) &#183; nail into</text>
  <text x="500.0" y="302.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">the studs &#183; each board 20&#8243;</text>
  <text x="500.0" y="319.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2b2b2b">shorter than the one below</text>

  <!-- roof line (rake board, Stage 9) -->
  <line x1="486.4" y1="126.0" x2="100.0" y2="270.9" stroke="#808080" stroke-width="4"/>
  <text x="120.0" y="163.5" font-size="13" text-anchor="start" font-weight="normal" fill="#808080">roof line &#183; rake board (built Stage 9)</text>
  <line x1="230.0" y1="167.5" x2="214.0" y2="215.0" stroke="#808080" stroke-width="1" marker-end="url(#arrd)"/>

  <!-- frieze (Stage 11, later) -->
  <polygon points="461.1,135.6 125.3,261.4 125.3,303.9 461.1,178.1" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="120.0" y="345.0" font-size="13" text-anchor="start" font-weight="normal" fill="#808080">frieze &#8212; Stage 11, later</text>
  <line x1="200.0" y1="336.0" x2="185.0" y2="288.0" stroke="#808080" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrd)"/>

  <!-- 7" exposure dimension -->
  <line x1="100.0" y1="695.5" x2="88.0" y2="695.5" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100.0" y1="663.3" x2="88.0" y2="663.3" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="84.0" y1="695.5" x2="84.0" y2="663.3" stroke="#555555" stroke-width="1.2"/>
  <line x1="80.0" y1="695.5" x2="88.0" y2="695.5" stroke="#555555" stroke-width="1.2"/>
  <line x1="80.0" y1="663.3" x2="88.0" y2="663.3" stroke="#555555" stroke-width="1.2"/>
  <text x="56.0" y="683.9" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">7&#8243;</text>

  <text x="100.0" y="762.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#555555">back end</text>
  <text x="486.4" y="762.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#555555">front (street) end</text>
  <line x1="48.0" y1="560.0" x2="48.0" y2="640.0" stroke="#2b2b2b" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="44.0" y="658.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2b2b2b">DOWN</text>
</svg>
